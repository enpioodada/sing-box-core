name: Update sing-box

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/workflows/delete-old-workflows.yml"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

# ============================================================
# 全局并发控制
#
# 防止：
# 1. schedule 同时运行
# 2. workflow_dispatch 同时运行
# 3. main push 同时运行
#
# 导致 Release / README git push 冲突
# ============================================================
concurrency:
  group: update-sing-box
  cancel-in-progress: false


# ============================================================
# ============================================================
# JOBS
# ============================================================
# ============================================================

jobs:

  # ============================================================
  # 1. Get latest Go version
  # ============================================================
  go:
    runs-on: ubuntu-latest

    outputs:
      go_version: ${{ steps.go.outputs.version }}

    steps:
      - name: Get latest Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json |
            jq -r '.[0].version'
          )"

          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::无法获取 Go 版本"
            exit 1
          fi

          echo "Go version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. PuerNya
  # ============================================================
  puernya:
    runs-on: ubuntu-latest

    needs:
      - go

    outputs:
      puernya_version: ${{ steps.version.outputs.puernya_version }}
      puernya_time: ${{ steps.version.outputs.puernya_time }}
      puernya_tags: ${{ steps.version.outputs.puernya_tags }}
      puernya_skip_update: ${{ steps.compare.outputs.skip_update }}

    steps:

      - name: Checkout PuerNya/building
        uses: actions/checkout@v7
        with:
          repository: PuerNya/sing-box
          ref: building
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Get PuerNya version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git remote add sekai https://github.com/SagerNet/sing-box.git
          git fetch --tags sekai

          puernya_version="$(
            CGO_ENABLED=0 go run ./cmd/internal/read_tag
          )"

          if [[ -z "$puernya_version" ]]; then
            echo "::error::无法获取 PuerNya 版本"
            exit 1
          fi

          ver_commit="$(
            echo "$puernya_version" |
            awk -F '-' '{print $3}'
          )"

          if [[ -z "$ver_commit" ]]; then
            echo "::error::无法从 PuerNya 版本中解析 commit"
            exit 1
          fi

          puernya_time="$(
            git log -1 \
              --format=%cd \
              --date=format:'%Y-%m-%d' \
              "$ver_commit"
          )"

          if [[ -z "$puernya_time" ]]; then
            echo "::error::无法获取 PuerNya 发布时间"
            exit 1
          fi

          puernya_tags="with_quic,with_dhcp,with_wireguard,with_shadowsocksr,with_ech,with_utls,with_clash_api,with_gvisor"

          echo "puernya_version=$puernya_version" >> "$GITHUB_OUTPUT"
          echo "puernya_time=$puernya_time" >> "$GITHUB_OUTPUT"
          echo "puernya_tags=$puernya_tags" >> "$GITHUB_OUTPUT"

          echo "PuerNya version: $puernya_version"
          echo "PuerNya date: $puernya_time"
          echo "PuerNya tags: $puernya_tags"

      - name: Compare PuerNya version
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          current_body="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          version="${{ steps.version.outputs.puernya_version }}"

          if echo "$current_body" | grep -Fq "$version"; then
            echo "PuerNya 当前版本已是最新版本"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "PuerNya 需要更新"
            echo "skip_update=false" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # PuerNya Build
  #
  # 如果没有更新：
  #   整个 job skipped
  #
  # 如果有更新：
  #   3 个架构必须全部成功
  # ============================================================
  puernya_cross:
    runs-on: ubuntu-latest

    needs:
      - go
      - puernya

    if: ${{ needs.puernya.outputs.puernya_skip_update != 'true' }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: linux-amd64
            goos: linux
            goarch: amd64
            goamd64: v1

          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7

          - name: linux-arm64
            goos: linux
            goarch: arm64

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0

      puernya_VERSION: ${{ needs.puernya.outputs.puernya_version }}
      puernya_TAGS: ${{ needs.puernya.outputs.puernya_tags }}

    steps:

      - name: Checkout PuerNya/building
        uses: actions/checkout@v7
        with:
          repository: PuerNya/sing-box
          ref: building

      - name: Fix sniff
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/sniffHosts/sniffHost/' \
            ./experimental/clashapi/trafficontrol/tracker.go

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build PuerNya
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-checklinkname=0 -X 'github.com/sagernet/sing-box/constant.Version=${puernya_VERSION}' -s -w -buildid=" \
            -tags "${puernya_TAGS}" \
            ./cmd/sing-box

          test -f sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-puernya-${{ matrix.name }}
          path: sing-box
          if-no-files-found: error


  # ============================================================
  # 3. reF1nd Stable
  # ============================================================
  ref1nd_stable_version:
    runs-on: ubuntu-latest

    needs:
      - go

    outputs:
      ref1nd_stable_version: ${{ steps.version.outputs.ref1nd_stable_version }}
      ref1nd_stable_time: ${{ steps.version.outputs.ref1nd_stable_time }}

      ref1nd_stable_linux_tags: ${{ steps.version.outputs.ref1nd_stable_linux_tags }}
      ref1nd_stable_windows_tags: ${{ steps.version.outputs.ref1nd_stable_windows_tags }}

      ref1nd_stable_skip_update: ${{ steps.compare.outputs.skip_update }}

    steps:

      - name: Get reF1nd-Stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # ======================================================
          # 重要：
          # tags 必须在 exit 0 之前写入 GITHUB_OUTPUT
          #
          # 修复：
          # 原代码把 linux_tags/windows_tags 写在 exit 0 后面，
          # 导致永远不会执行。
          # ======================================================

          ref1nd_stable_linux_tags="with_quic,with_utls,with_clash_api"
          ref1nd_stable_windows_tags="with_gvisor,with_quic,with_utls,with_clash_api,with_tailscale"

          echo "ref1nd_stable_linux_tags=$ref1nd_stable_linux_tags" >> "$GITHUB_OUTPUT"
          echo "ref1nd_stable_windows_tags=$ref1nd_stable_windows_tags" >> "$GITHUB_OUTPUT"

          while true; do

            found=""

            for page in {1..10}; do

              tags="$(
                curl -fsSL \
                  --retry 5 \
                  --retry-delay 2 \
                  --retry-all-errors \
                  "https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100&page=${page}"
              )"

              candidate="$(
                echo "$tags" |
                jq -r '.[].name' |
                grep -Po '^v?\K[0-9]+\.[0-9]+\.[0-9]+-reF1nd.*' |
                head -n 1 || true
              )"

              if [[ -n "$candidate" &&
                    "$candidate" != "null" ]]; then

                found="$candidate"
                break
              fi

              echo "reF1nd-Stable 第 ${page} 页没有找到版本"
            done

            if [[ -n "$found" ]]; then

              ref1nd_stable_version="$found"

              echo "找到 reF1nd-Stable: $ref1nd_stable_version"

              commit_json="$(
                curl -fsSL \
                  --retry 5 \
                  --retry-delay 2 \
                  --retry-all-errors \
                  "https://api.github.com/repos/reF1nd/sing-box/commits/v${ref1nd_stable_version}"
              )"

              commit_date="$(
                echo "$commit_json" |
                jq -r '.commit.committer.date'
              )"

              if [[ -z "$commit_date" || "$commit_date" == "null" ]]; then
                echo "::error::无法获取 reF1nd-Stable 发布时间"
                exit 1
              fi

              ref1nd_stable_time="$(
                date -d "$commit_date" '+%Y-%m-%d'
              )"

              echo "ref1nd_stable_version=$ref1nd_stable_version" >> "$GITHUB_OUTPUT"
              echo "ref1nd_stable_time=$ref1nd_stable_time" >> "$GITHUB_OUTPUT"

              # 到这里才允许结束
              exit 0
            fi

            echo "暂时没有找到 reF1nd-Stable，30 秒后重试"
            sleep 30

          done

      - name: Compare reF1nd-Stable version
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          current_body="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          version="${{ steps.version.outputs.ref1nd_stable_version }}"

          if echo "$current_body" | grep -Fq "$version"; then
            echo "reF1nd-Stable 已是最新版本"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "reF1nd-Stable 需要更新"
            echo "skip_update=false" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # reF1nd Stable Build
  # ============================================================
  ref1nd_stable_cross:
    runs-on: ubuntu-latest

    needs:
      - ref1nd_stable_version

    if: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_skip_update != 'true' }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: linux-amd64-v1
            goos: linux
            goarch: amd64
            goamd64: v1

          - name: linux-amd64-v3
            goos: linux
            goarch: amd64
            goamd64: v3

          - name: linux-armv5
            goos: linux
            goarch: arm
            goarm: 5

          - name: linux-armv6
            goos: linux
            goarch: arm
            goarm: 6

          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7

          - name: linux-arm64
            goos: linux
            goarch: arm64

          - name: linux-mips-softfloat
            goos: linux
            goarch: mips
            gomips: softfloat

          - name: linux-mipsle-softfloat
            goos: linux
            goarch: mipsle
            gomips: softfloat

          - name: linux-mipsle-hardfloat
            goos: linux
            goarch: mipsle
            gomips: hardfloat

          - name: windows-amd64-v1
            goos: windows
            goarch: amd64
            goamd64: v1

          - name: windows-amd64-v3
            goos: windows
            goarch: amd64
            goamd64: v3

          - name: windows-arm64
            goos: windows
            goarch: arm64

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0

      ref1nd_stable_VERSION: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_version }}
      ref1nd_stable_linux_TAGS: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_linux_tags }}
      ref1nd_stable_windows_TAGS: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_windows_tags }}

    steps:

      - name: Checkout reF1nd-Stable
        uses: actions/checkout@v7
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-stable

      - name: Get Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-stable/.github/workflows/build.yml |
            grep 'go-version:' |
            head -n 1 |
            awk '{print $2}'
          )"

          if [[ -z "$version" ]]; then
            echo "::error::无法获取 reF1nd-Stable Go 版本"
            exit 1
          fi

          echo "go_version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.go_version }}

      - name: Build reF1nd-Stable Linux
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${ref1nd_stable_VERSION}' -s -w -buildid=" \
            -tags "${ref1nd_stable_linux_TAGS}" \
            ./cmd/sing-box

          test -f sing-box

      - name: Build reF1nd-Stable Windows
        if: ${{ matrix.goos == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${ref1nd_stable_VERSION}' -s -w -buildid=" \
            -tags "${ref1nd_stable_windows_TAGS}" \
            ./cmd/sing-box

          test -f sing-box.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-ref1nd-stable-${{ matrix.name }}
          path: |
            sing-box
            sing-box.exe
          if-no-files-found: error


  # ============================================================
  # 4. reF1nd Test
  # ============================================================
  ref1nd_test_version:
    runs-on: ubuntu-latest

    needs:
      - go

    outputs:
      ref1nd_test_version: ${{ steps.version.outputs.ref1nd_test_version }}
      ref1nd_test_time: ${{ steps.version.outputs.ref1nd_test_time }}

      ref1nd_test_linux_tags: ${{ steps.version.outputs.ref1nd_test_linux_tags }}
      ref1nd_test_windows_tags: ${{ steps.version.outputs.ref1nd_test_windows_tags }}

      ref1nd_test_skip_update: ${{ steps.compare.outputs.skip_update }}

    steps:

      - name: Get reF1nd-Test version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          ref1nd_test_linux_tags="with_quic,with_utls,with_clash_api"
          ref1nd_test_windows_tags="with_gvisor,with_quic,with_utls,with_clash_api,with_tailscale"

          echo "ref1nd_test_linux_tags=$ref1nd_test_linux_tags" >> "$GITHUB_OUTPUT"
          echo "ref1nd_test_windows_tags=$ref1nd_test_windows_tags" >> "$GITHUB_OUTPUT"

          while true; do

            releases="$(
              curl -fsSL \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                "https://api.github.com/repos/reF1nd/sing-box/releases?per_page=100"
            )"

            ref1nd_test_version="$(
              echo "$releases" |
              jq -r '.[].tag_name' |
              grep -Po '^v\K.*(alpha|beta|rc).*-reF1nd.*' |
              head -n 1 || true
            )"

            if [[ -n "$ref1nd_test_version" &&
                  "$ref1nd_test_version" != "null" ]]; then

              echo "找到 reF1nd-Test: $ref1nd_test_version"

              commit_date="$(
                curl -fsSL \
                  --retry 5 \
                  --retry-delay 2 \
                  --retry-all-errors \
                  "https://api.github.com/repos/reF1nd/sing-box/commits/v${ref1nd_test_version}" |
                jq -r '.commit.committer.date'
              )"

              if [[ -z "$commit_date" || "$commit_date" == "null" ]]; then
                echo "::error::无法获取 reF1nd-Test 发布时间"
                exit 1
              fi

              ref1nd_test_time="$(
                date -d "$commit_date" '+%Y-%m-%d'
              )"

              echo "ref1nd_test_version=$ref1nd_test_version" >> "$GITHUB_OUTPUT"
              echo "ref1nd_test_time=$ref1nd_test_time" >> "$GITHUB_OUTPUT"

              break
            fi

            echo "未获取到 reF1nd-Test，30 秒后重试"
            sleep 30

          done

      - name: Compare reF1nd-Test version
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          current_body="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          version="${{ steps.version.outputs.ref1nd_test_version }}"

          if echo "$current_body" | grep -Fq "$version"; then
            echo "reF1nd-Test 已是最新版本"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "reF1nd-Test 需要更新"
            echo "skip_update=false" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # reF1nd Test Build
  # ============================================================
  ref1nd_test_cross:
    runs-on: ubuntu-latest

    needs:
      - ref1nd_test_version

    if: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_skip_update != 'true' }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: linux-amd64-v1
            goos: linux
            goarch: amd64
            goamd64: v1

          - name: linux-amd64-v3
            goos: linux
            goarch: amd64
            goamd64: v3

          - name: linux-armv5
            goos: linux
            goarch: arm
            goarm: 5

          - name: linux-armv6
            goos: linux
            goarch: arm
            goarm: 6

          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7

          - name: linux-arm64
            goos: linux
            goarch: arm64

          - name: linux-mips-softfloat
            goos: linux
            goarch: mips
            gomips: softfloat

          - name: linux-mipsle-softfloat
            goos: linux
            goarch: mipsle
            gomips: softfloat

          - name: linux-mipsle-hardfloat
            goos: linux
            goarch: mipsle
            gomips: hardfloat

          - name: windows-amd64-v1
            goos: windows
            goarch: amd64
            goamd64: v1

          - name: windows-amd64-v3
            goos: windows
            goarch: amd64
            goamd64: v3

          - name: windows-arm64
            goos: windows
            goarch: arm64

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0

      ref1nd_test_VERSION: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_version }}
      ref1nd_test_linux_TAGS: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_linux_tags }}
      ref1nd_test_windows_TAGS: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_windows_tags }}

    steps:

      - name: Checkout reF1nd-Test
        uses: actions/checkout@v7
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-testing

      - name: Get Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/.github/workflows/build.yml |
            grep 'go-version:' |
            head -n 1 |
            awk '{print $2}'
          )"

          if [[ -z "$version" ]]; then
            echo "::error::无法获取 reF1nd-Test Go 版本"
            exit 1
          fi

          echo "go_version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.go_version }}

      - name: Build reF1nd-Test Linux
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${ref1nd_test_VERSION}' -s -w -buildid=" \
            -tags "${ref1nd_test_linux_TAGS}" \
            ./cmd/sing-box

          test -f sing-box

      - name: Build reF1nd-Test Windows
        if: ${{ matrix.goos == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${ref1nd_test_VERSION}' -s -w -buildid=" \
            -tags "${ref1nd_test_windows_TAGS}" \
            ./cmd/sing-box

          test -f sing-box.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-ref1nd-test-${{ matrix.name }}
          path: |
            sing-box
            sing-box.exe
          if-no-files-found: error


  # ============================================================
  # 5. sing-box Stable
  # ============================================================
  singbox_stable_version:
    runs-on: ubuntu-latest

    needs:
      - go

    outputs:
      singbox_stable_version: ${{ steps.version.outputs.singbox_stable_version }}
      singbox_stable_time: ${{ steps.version.outputs.singbox_stable_time }}

      singbox_stable_linux_tags: ${{ steps.version.outputs.singbox_stable_linux_tags }}
      singbox_stable_windows_tags: ${{ steps.version.outputs.singbox_stable_windows_tags }}

      singbox_stable_skip_update: ${{ steps.compare.outputs.skip_update }}

    steps:

      - name: Get sing-box Stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          singbox_stable_linux_tags="with_quic,with_utls,with_clash_api"
          singbox_stable_windows_tags="with_gvisor,with_quic,with_utls,with_clash_api,with_tailscale"

          echo "singbox_stable_linux_tags=$singbox_stable_linux_tags" >> "$GITHUB_OUTPUT"
          echo "singbox_stable_windows_tags=$singbox_stable_windows_tags" >> "$GITHUB_OUTPUT"

          while true; do

            latest="$(
              curl -fsSL \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                https://api.github.com/repos/SagerNet/sing-box/releases/latest
            )"

            singbox_stable_version="$(
              echo "$latest" |
              jq -r '.tag_name' |
              sed 's/^v//'
            )"

            if [[ -n "$singbox_stable_version" &&
                  "$singbox_stable_version" != "null" ]]; then

              singbox_stable_time="$(
                echo "$latest" |
                jq -r '.published_at // .created_at' |
                xargs -I {} date -d '{}' '+%Y-%m-%d'
              )"

              echo "sing-box Stable: $singbox_stable_version"
              echo "Date: $singbox_stable_time"

              echo "singbox_stable_version=$singbox_stable_version" >> "$GITHUB_OUTPUT"
              echo "singbox_stable_time=$singbox_stable_time" >> "$GITHUB_OUTPUT"

              break
            fi

            echo "未获取到 sing-box Stable，30 秒后重试"
            sleep 30

          done

      - name: Compare sing-box Stable version
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          current_body="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          version="${{ steps.version.outputs.singbox_stable_version }}"

          if echo "$current_body" | grep -Fq "$version"; then
            echo "sing-box Stable 已是最新版本"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "sing-box Stable 需要更新"
            echo "skip_update=false" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # sing-box Stable Build
  # ============================================================
  singbox_stable_cross:
    runs-on: ubuntu-latest

    needs:
      - singbox_stable_version

    if: ${{ needs.singbox_stable_version.outputs.singbox_stable_skip_update != 'true' }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: linux-amd64-v1
            goos: linux
            goarch: amd64
            goamd64: v1

          - name: linux-amd64-v3
            goos: linux
            goarch: amd64
            goamd64: v3

          - name: linux-armv5
            goos: linux
            goarch: arm
            goarm: 5

          - name: linux-armv6
            goos: linux
            goarch: arm
            goarm: 6

          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7

          - name: linux-arm64
            goos: linux
            goarch: arm64

          - name: linux-mips-softfloat
            goos: linux
            goarch: mips
            gomips: softfloat

          - name: linux-mipsle-softfloat
            goos: linux
            goarch: mipsle
            gomips: softfloat

          - name: linux-mipsle-hardfloat
            goos: linux
            goarch: mipsle
            gomips: hardfloat

          - name: windows-amd64-v1
            goos: windows
            goarch: amd64
