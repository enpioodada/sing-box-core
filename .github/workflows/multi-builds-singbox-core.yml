name: Update sing-box

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/workflows/delete-old-workflows.yml"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: update-sing-box
  cancel-in-progress: false


# ============================================================
# Global
# ============================================================

env:
  LINUX_TAGS: "with_quic,with_utls,with_clash_api"
  PUERNYA_TAGS: "with_quic,with_dhcp,with_wireguard,with_shadowsocksr,with_ech,with_utls,with_clash_api,with_gvisor"


jobs:

  # ==========================================================
  # Get Go version
  # ==========================================================

  go:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.go.outputs.version }}

    steps:
      - name: Get latest Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version=$(
            curl -fsSL \
              https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json |
            jq -r '.[0].version'
          )

          [[ -n "$version" && "$version" != "null" ]] || {
            echo "无法获取 Go 版本"
            exit 1
          }

          echo "Go version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"


  # ==========================================================
  # Check all versions
  # ==========================================================

  versions:
    runs-on: ubuntu-latest
    needs: go

    outputs:
      puernya_version: ${{ steps.puernya.outputs.version }}
      puernya_time: ${{ steps.puernya.outputs.time }}
      puernya_update: ${{ steps.puernya.outputs.update }}

      ref1nd_stable_version: ${{ steps.ref1nd_stable.outputs.version }}
      ref1nd_stable_time: ${{ steps.ref1nd_stable.outputs.time }}
      ref1nd_stable_update: ${{ steps.ref1nd_stable.outputs.update }}

      ref1nd_test_version: ${{ steps.ref1nd_test.outputs.version }}
      ref1nd_test_time: ${{ steps.ref1nd_test.outputs.time }}
      ref1nd_test_update: ${{ steps.ref1nd_test.outputs.update }}

      singbox_stable_version: ${{ steps.singbox_stable.outputs.version }}
      singbox_stable_time: ${{ steps.singbox_stable.outputs.time }}
      singbox_stable_update: ${{ steps.singbox_stable.outputs.update }}

      singbox_test_version: ${{ steps.singbox_test.outputs.version }}
      singbox_test_time: ${{ steps.singbox_test.outputs.time }}
      singbox_test_update: ${{ steps.singbox_test.outputs.update }}

    steps:

      # ------------------------------------------------------
      # Current Release body
      # ------------------------------------------------------

      - name: Get current release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
          jq -r '.body // ""' > release_body.txt

          echo "当前 Release："
          cat release_body.txt


      # ------------------------------------------------------
      # PuerNya
      # ------------------------------------------------------

      - name: Get PuerNya
        id: puernya
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            --branch building \
            https://github.com/PuerNya/sing-box.git \
            puernya

          cd puernya

          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch --tags upstream

          version=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag)

          [[ -n "$version" ]] || {
            echo "无法获取 PuerNya 版本"
            exit 1
          }

          commit=$(echo "$version" | awk -F '-' '{print $3}')

          time=$(
            git log -1 \
              --format=%cd \
              --date=format:'%Y-%m-%d' \
              "$commit"
          )

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"

          if grep -Fq "$version" ../release_body.txt; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "PuerNya: 无更新"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "PuerNya: $version"
          fi


      # ------------------------------------------------------
      # reF1nd Stable
      # ------------------------------------------------------

      - name: Get reF1nd Stable
        id: ref1nd_stable
        shell: bash
        run: |
          set -euo pipefail

          for page in {1..5}; do

            tags=$(
              curl -fsSL \
                "https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100&page=${page}"
            )

            version=$(
              jq -r '.[].name' <<< "$tags" |
              grep -m1 -E '^v?[0-9]+\.[0-9]+\.[0-9]+-reF1nd' || true
            )

            if [[ -n "$version" ]]; then
              version="${version#v}"
              break
            fi

          done

          [[ -n "${version:-}" ]] || {
            echo "无法获取 reF1nd Stable 版本"
            exit 1
          }

          date_raw=$(
            curl -fsSL \
              "https://api.github.com/repos/reF1nd/sing-box/commits/v${version}" |
            jq -r '.commit.committer.date'
          )

          time=$(date -d "$date_raw +8 hours" '+%Y-%m-%d')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"

          if grep -Fq "$version" ../release_body.txt; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "reF1nd Stable: 无更新"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "reF1nd Stable: $version"
          fi


      # ------------------------------------------------------
      # reF1nd Test
      # ------------------------------------------------------

      - name: Get reF1nd Test
        id: ref1nd_test
        shell: bash
        run: |
          set -euo pipefail

          for page in {1..5}; do

            tags=$(
              curl -fsSL \
                "https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100&page=${page}"
            )

            version=$(
              jq -r '.[].name' <<< "$tags" |
              grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+.*(alpha|beta|rc).*-[Rr]eF1nd' || true
            )

            if [[ -n "$version" ]]; then
              version="${version#v}"
              break
            fi

          done

          [[ -n "${version:-}" ]] || {
            echo "无法获取 reF1nd Test 版本"
            exit 1
          }

          date_raw=$(
            curl -fsSL \
              "https://api.github.com/repos/reF1nd/sing-box/commits/v${version}" |
            jq -r '.commit.committer.date'
          )

          time=$(date -d "$date_raw +8 hours" '+%Y-%m-%d')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"

          if grep -Fq "$version" ../release_body.txt; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "reF1nd Test: 无更新"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "reF1nd Test: $version"
          fi


      # ------------------------------------------------------
      # sing-box Stable
      # ------------------------------------------------------

      - name: Get sing-box Stable
        id: singbox_stable
        shell: bash
        run: |
          set -euo pipefail

          latest=$(
            curl -fsSL \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest
          )

          version=$(jq -r '.tag_name' <<< "$latest")
          version="${version#v}"

          date_raw=$(jq -r '.published_at // .created_at' <<< "$latest")
          time=$(date -d "$date_raw +8 hours" '+%Y-%m-%d')

          [[ -n "$version" && "$version" != "null" ]] || {
            echo "无法获取 sing-box Stable"
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"

          if grep -Fq "$version" release_body.txt; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "sing-box Stable: 无更新"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "sing-box Stable: $version"
          fi


      # ------------------------------------------------------
      # sing-box Test
      # ------------------------------------------------------

      - name: Get sing-box Test
        id: singbox_test
        shell: bash
        run: |
          set -euo pipefail

          releases=$(
            curl -fsSL \
              "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=100"
          )

          data=$(
            jq -r '
              .[]
              | select(.tag_name | test("^v[0-9].*(alpha|beta|rc)"))
              | [(.tag_name | ltrimstr("v")), (.published_at // .created_at)]
              | @tsv
            ' <<< "$releases" |
            head -n1
          )

          version=$(cut -f1 <<< "$data")
          date_raw=$(cut -f2 <<< "$data")

          [[ -n "$version" && -n "$date_raw" ]] || {
            echo "无法获取 sing-box Test"
            exit 1
          }

          time=$(date -d "$date_raw +8 hours" '+%Y-%m-%d')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"

          if grep -Fq "$version" release_body.txt; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "sing-box Test: 无更新"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "sing-box Test: $version"
          fi


  # ==========================================================
  # Build
  #
  # 5 versions × 4 architectures = 20 parallel jobs
  # ==========================================================

  build:
    runs-on: ubuntu-latest
    needs:
      - go
      - versions

    if: >
      ${{
        needs.versions.outputs.puernya_update == 'true' ||
        needs.versions.outputs.ref1nd_stable_update == 'true' ||
        needs.versions.outputs.ref1nd_test_update == 'true' ||
        needs.versions.outputs.singbox_stable_update == 'true' ||
        needs.versions.outputs.singbox_test_update == 'true'
      }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # --------------------------------------------------
          # PuerNya
          # --------------------------------------------------

          - name: puernya
            repo: PuerNya/sing-box
            ref: building
            version: puernya
            update: puernya_update
            arch: amd64-v1
            goarch: amd64
            goamd64: v1

          - name: puernya
            repo: PuerNya/sing-box
            ref: building
            version: puernya
            update: puernya_update
            arch: amd64-v3
            goarch: amd64
            goamd64: v3

          - name: puernya
            repo: PuerNya/sing-box
            ref: building
            version: puernya
            update: puernya_update
            arch: armv7
            goarch: arm
            goarm: 7

          - name: puernya
            repo: PuerNya/sing-box
            ref: building
            version: puernya
            update: puernya_update
            arch: arm64
            goarch: arm64


          # --------------------------------------------------
          # reF1nd Stable
          # --------------------------------------------------

          - name: ref1nd-stable
            repo: reF1nd/sing-box
            ref: reF1nd-stable
            version: ref1nd_stable
            update: ref1nd_stable_update
            arch: amd64-v1
            goarch: amd64
            goamd64: v1

          - name: ref1nd-stable
            repo: reF1nd/sing-box
            ref: reF1nd-stable
            version: ref1nd_stable
            update: ref1nd_stable_update
            arch: amd64-v3
            goarch: amd64
            goamd64: v3

          - name: ref1nd-stable
            repo: reF1nd/sing-box
            ref: reF1nd-stable
            version: ref1nd_stable
            update: ref1nd_stable_update
            arch: armv7
            goarch: arm
            goarm: 7

          - name: ref1nd-stable
            repo: reF1nd/sing-box
            ref: reF1nd-stable
            version: ref1nd_stable
            update: ref1nd_stable_update
            arch: arm64
            goarch: arm64


          # --------------------------------------------------
          # reF1nd Test
          # --------------------------------------------------

          - name: ref1nd-test
            repo: reF1nd/sing-box
            ref: reF1nd-testing
            version: ref1nd_test
            update: ref1nd_test_update
            arch: amd64-v1
            goarch: amd64
            goamd64: v1

          - name: ref1nd-test
            repo: reF1nd/sing-box
            ref: reF1nd-testing
            version: ref1nd_test
            update: ref1nd_test_update
            arch: amd64-v3
            goarch: amd64
            goamd64: v3

          - name: ref1nd-test
            repo: reF1nd/sing-box
            ref: reF1nd-testing
            version: ref1nd_test
            update: ref1nd_test_update
            arch: armv7
            goarch: arm
            goarm: 7

          - name: ref1nd-test
            repo: reF1nd/sing-box
            ref: reF1nd-testing
            version: ref1nd_test
            update: ref1nd_test_update
            arch: arm64
            goarch: arm64


          # --------------------------------------------------
          # sing-box Stable
          # --------------------------------------------------

          - name: singbox-stable
            repo: SagerNet/sing-box
            ref: stable
            version: singbox_stable
            update: singbox_stable_update
            arch: amd64-v1
            goarch: amd64
            goamd64: v1

          - name: singbox-stable
            repo: SagerNet/sing-box
            ref: stable
            version: singbox_stable
            update: singbox_stable_update
            arch: amd64-v3
            goarch: amd64
            goamd64: v3

          - name: singbox-stable
            repo: SagerNet/sing-box
            ref: stable
            version: singbox_stable
            update: singbox_stable_update
            arch: armv7
            goarch: arm
            goarm: 7

          - name: singbox-stable
            repo: SagerNet/sing-box
            ref: stable
            version: singbox_stable
            update: singbox_stable_update
            arch: arm64
            goarch: arm64


          # --------------------------------------------------
          # sing-box Test
          # --------------------------------------------------

          - name: singbox-test
            repo: SagerNet/sing-box
            ref: testing
            version: singbox_test
            update: singbox_test_update
            arch: amd64-v1
            goarch: amd64
            goamd64: v1

          - name: singbox-test
            repo: SagerNet/sing-box
            ref: testing
            version: singbox_test
            update: singbox_test_update
            arch: amd64-v3
            goarch: amd64
            goamd64: v3

          - name: singbox-test
            repo: SagerNet/sing-box
            ref: testing
            version: singbox_test
            update: singbox_test_update
            arch: armv7
            goarch: arm
            goarm: 7

          - name: singbox-test
            repo: SagerNet/sing-box
            ref: testing
            version: singbox_test
            update: singbox_test_update
            arch: arm64
            goarch: arm64


    # ========================================================
    # Matrix environment
    # ========================================================

    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0

      VERSION: ${{ needs.versions.outputs[matrix.version + '_version'] }}

    steps:

      # ------------------------------------------------------
      # Skip unchanged version
      # ------------------------------------------------------

      - name: Check update
        if: ${{ needs.versions.outputs[matrix.update] != 'true' }}
        run: echo "${{ matrix.name }} 无更新，跳过编译"


      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        if: ${{ needs.versions.outputs[matrix.update] == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}


      # ------------------------------------------------------
      # PuerNya fix
      # ------------------------------------------------------

      - name: Fix sniff
        if: >
          ${{
            needs.versions.outputs[matrix.update] == 'true' &&
            matrix.name == 'puernya'
          }}
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/sniffHosts/sniffHost/' \
            ./experimental/clashapi/trafficontrol/tracker.go


      # ------------------------------------------------------
      # Go
      # ------------------------------------------------------

      - name: Setup Go
        if: ${{ needs.versions.outputs[matrix.update] == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go.outputs.version }}


      # ------------------------------------------------------
      # Build
      # ------------------------------------------------------

      - name: Build
        if: ${{ needs.versions.outputs[matrix.update] == 'true' }}
        shell: bash
        env:
          TAGS: ${{ matrix.name == 'puernya' && env.PUERNYA_TAGS || env.LINUX_TAGS }}
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-checklinkname=0 -X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "$TAGS" \
            ./cmd/sing-box

          test -f sing-box


      # ------------------------------------------------------
      # Upload
      # ------------------------------------------------------

      - name: Upload artifact
        if: ${{ needs.versions.outputs[matrix.update] == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-${{ matrix.name }}-${{ matrix.arch }}
          path: sing-box
          if-no-files-found: error


  # ==========================================================
  # Release
  # ==========================================================

  release:
    runs-on: ubuntu-latest

    needs:
      - versions
      - build

    if: ${{ always() && needs.versions.result == 'success' }}

    steps:

      # ------------------------------------------------------
      # Determine whether release is needed
      # ------------------------------------------------------

      - name: Check build status
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "部分编译任务失败"
            echo "失败版本不会进入 Release"
          fi

          if [[ \
            "${{ needs.versions.outputs.puernya_update }}" == "true" ||
            "${{ needs.versions.outputs.ref1nd_stable_update }}" == "true" ||
            "${{ needs.versions.outputs.ref1nd_test_update }}" == "true" ||
            "${{ needs.versions.outputs.singbox_stable_update }}" == "true" ||
            "${{ needs.versions.outputs.singbox_test_update }}" == "true"
          ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi


      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        if: ${{ steps.check.outputs.release == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # ------------------------------------------------------
      # Download successful artifacts
      # ------------------------------------------------------

      - name: Download artifacts
        if: ${{ steps.check.outputs.release == 'true' }}
        uses: actions/download-artifact@v8
        with:
          path: ./tmp/


      # ------------------------------------------------------
      # Prepare
      # ------------------------------------------------------

      - name: Prepare files
        if: ${{ steps.check.outputs.release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          prepare() {
            local name="$1"
            local ext="$2"

            for arch in amd64-v1 amd64-v3 armv7 arm64; do

              src="./tmp/sing-box-${name}-${arch}/sing-box"

              if [[ ! -f "$src" ]]; then
                echo "跳过失败或未更新：${name} ${arch}"
                continue
              fi

              if [[ "$ext" == "upx" ]]; then
                cp "$src" \
                  "./sing-box/sing-box-${name}-linux-${arch}.upx"
                chmod +x \
                  "./sing-box/sing-box-${name}-linux-${arch}.upx"
              else
                cp "$src" \
                  "./tmp/sing-box"

                chmod +x ./tmp/sing-box

                tar \
                  --no-same-owner \
                  -czf \
                  "./sing-box/sing-box-${name}-linux-${arch}.tar.gz" \
                  -C ./tmp \
                  sing-box
              fi

            done
          }

          prepare "puernya" "tar"
          prepare "ref1nd-stable" "upx"
          prepare "ref1nd-test" "upx"
          prepare "singbox-stable" "upx"
          prepare "singbox-test" "upx"


      # ------------------------------------------------------
      # UPX
      # ------------------------------------------------------

      - name: Setup UPX
        if: ${{ steps.check.outputs.release == 'true' }}
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          files: ./sing-box/*.upx


      # ------------------------------------------------------
      # Check
      # ------------------------------------------------------

      - name: Check files
        id: files
        if: ${{ steps.check.outputs.release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if compgen -G "./sing-box/*" > /dev/null; then
            echo "发现以下文件："
            find ./sing-box \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
            sort

            echo "exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "没有可发布文件"
            echo "exist=false" >> "$GITHUB_OUTPUT"
          fi


      # ------------------------------------------------------
      # Release
      # ------------------------------------------------------

      - name: Release
        if: ${{ steps.files.outputs.exist == 'true' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box
          tag: sing-box
          overwrite: true
          file_glob: true
          file: ./sing-box/*

          body: |
            # 📝 Release Notes

            1. 更新 [sing-box PuerNya 版](https://github.com/PuerNya/sing-box/tree/building) 至 v${{ needs.versions.outputs.puernya_version }}，发布于 ${{ needs.versions.outputs.puernya_time }}

            2. 更新 [sing-box reF1nd-Stable 版](https://github.com/reF1nd/sing-box/tree/reF1nd-stable) 至 v${{ needs.versions.outputs.ref1nd_stable_version }}，发布于 ${{ needs.versions.outputs.ref1nd_stable_time }}

            3. 更新 [sing-box reF1nd-Test 版](https://github.com/reF1nd/sing-box/tree/reF1nd-testing) 至 v${{ needs.versions.outputs.ref1nd_test_version }}，发布于 ${{ needs.versions.outputs.ref1nd_test_time }}

            4. 更新 [sing-box Stable 版](https://github.com/SagerNet/sing-box/tree/stable) 至 v${{ needs.versions.outputs.singbox_stable_version }}，发布于 ${{ needs.versions.outputs.singbox_stable_time }}

            5. 更新 [sing-box Test 版](https://github.com/SagerNet/sing-box/tree/testing) 至 v${{ needs.versions.outputs.singbox_test_version }}，发布于 ${{ needs.versions.outputs.singbox_test_time }}

            ## Architectures

            - Linux amd64-v1
            - Linux amd64-v3
            - Linux armv7
            - Linux arm64


  # ==========================================================
  # README
  # ==========================================================

  readme:
    runs-on: ubuntu-latest

    needs:
      - versions
      - release

    if: ${{ needs.release.result == 'success' }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update README
        shell: bash
        run: |
          set -euo pipefail

          cat > README.md <<EOF
          # Sing-Box 核心编译

          ## Linux amd64-v1

          \`\`\`bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-puernya-linux-amd64-v1.tar.gz | tar -zx -C /usr/local/bin
          \`\`\`

          ## Linux amd64-v3

          \`\`\`bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-puernya-linux-amd64-v3.tar.gz | tar -zx -C /usr/local/bin
          \`\`\`

          ## Linux armv7

          \`\`\`bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-puernya-linux-armv7.tar.gz | tar -zx -C /usr/local/bin
          \`\`\`

          ## Linux arm64

          \`\`\`bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-puernya-linux-arm64.tar.gz | tar -zx -C /usr/local/bin
          \`\`\`

          ## Changelog

          1. PuerNya：v${{ needs.versions.outputs.puernya_version }}（${{ needs.versions.outputs.puernya_time }}）

          2. reF1nd-Stable：v${{ needs.versions.outputs.ref1nd_stable_version }}（${{ needs.versions.outputs.ref1nd_stable_time }}）

          3. reF1nd-Test：v${{ needs.versions.outputs.ref1nd_test_version }}（${{ needs.versions.outputs.ref1nd_test_time }}）

          4. sing-box Stable：v${{ needs.versions.outputs.singbox_stable_version }}（${{ needs.versions.outputs.singbox_stable_time }}）

          5. sing-box Test：v${{ needs.versions.outputs.singbox_test_version }}（${{ needs.versions.outputs.singbox_test_time }}）
          EOF


      - name: Commit README
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README 没有变化"
            exit 0
          fi

          git commit -m "Update README"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
