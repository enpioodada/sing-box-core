            echo "reF1nd-Test 需要更新"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi


# ============================================================
# sing-box Stable
# ============================================================
  singbox_stable:
    runs-on: ubuntu-latest
    needs: go

    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}

    steps:
      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "tags=with_quic,with_utls,with_clash_api" >> "$GITHUB_OUTPUT"

          latest="$(
            curl -fsSL \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest
          )"

          version="$(jq -r '.tag_name' <<< "$latest")"
          published="$(jq -r '.published_at // .created_at' <<< "$latest")"

          [[ -n "$version" && "$version" != "null" ]]
          [[ -n "$published" && "$published" != "null" ]]

          version="${version#v}"
          time="$(date -d "$published +8 hours" '+%Y-%m-%d')"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"

