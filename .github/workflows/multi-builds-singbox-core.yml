  # ============================================================
  # ============================================================
  # FINAL BUILD GATE
  # ============================================================
  #
  # 这是整个 Workflow 最重要的安全闸门。
  #
  # 每个版本必须满足：
  #
  # A. version job == success
  #
  # 并且：
  #
  # B. cross job == success
  #    或
  #    cross job == skipped
  #
  # skipped 只能代表：
  #    该版本没有更新
  #
  # 任何 cross failure：
  #
  #    ❌ gate failure
  #    ❌ Release
  #    ❌ README
  #
  # ============================================================
  build_gate:
    runs-on: ubuntu-latest

    needs:

      - puernya
      - puernya_cross

      - ref1nd_stable_version
      - ref1nd_stable_cross

      - ref1nd_test_version
      - ref1nd_test_cross

      - singbox_stable_version
      - singbox_stable_cross

      - singbox_test_version
      - singbox_test_cross

    if: ${{ always() }}

    outputs:
      all_builds_ok: ${{ steps.gate.outputs.all_builds_ok }}
      has_update: ${{ steps.gate.outputs.has_update }}

    steps:

      - name: Verify all five versions
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking five version build states"
          echo "=================================================="

          echo ""
          echo "PuerNya:"
          echo "  version = ${{ needs.puernya.result }}"
          echo "  build   = ${{ needs.puernya_cross.result }}"

          echo ""
          echo "reF1nd-Stable:"
          echo "  version = ${{ needs.ref1nd_stable_version.result }}"
          echo "  build   = ${{ needs.ref1nd_stable_cross.result }}"

          echo ""
          echo "reF1nd-Test:"
          echo "  version = ${{ needs.ref1nd_test_version.result }}"
          echo "  build   = ${{ needs.ref1nd_test_cross.result }}"

          echo ""
          echo "sing-box Stable:"
          echo "  version = ${{ needs.singbox_stable_version.result }}"
          echo "  build   = ${{ needs.singbox_stable_cross.result }}"

          echo ""
          echo "sing-box Test:"
          echo "  version = ${{ needs.singbox_test_version.result }}"
          echo "  build   = ${{ needs.singbox_test_cross.result }}"

          # ----------------------------------------------------
          # 所有 version detection job 必须成功
          # ----------------------------------------------------

          if [[ "${{ needs.puernya.result }}" != "success" ]]; then
            echo "::error::PuerNya version detection failed"
            exit 1
          fi

          if [[ "${{ needs.ref1nd_stable_version.result }}" != "success" ]]; then
            echo "::error::reF1nd-Stable version detection failed"
            exit 1
          fi

          if [[ "${{ needs.ref1nd_test_version.result }}" != "success" ]]; then
            echo "::error::reF1nd-Test version detection failed"
            exit 1
          fi

          if [[ "${{ needs.singbox_stable_version.result }}" != "success" ]]; then
            echo "::error::sing-box Stable version detection failed"
            exit 1
          fi

          if [[ "${{ needs.singbox_test_version.result }}" != "success" ]]; then
            echo "::error::sing-box Test version detection failed"
            exit 1
          fi

          # ----------------------------------------------------
          # Build job：
          #
          # success = 已更新并且全部架构构建成功
          #
          # skipped = 没有更新，因此正确跳过
          #
          # failure/cancelled = 绝对禁止 Release
          # ----------------------------------------------------

          allowed="success skipped"

          for state in \
            "${{ needs.puernya_cross.result }}" \
            "${{ needs.ref1nd_stable_cross.result }}" \
            "${{ needs.ref1nd_test_cross.result }}" \
            "${{ needs.singbox_stable_cross.result }}" \
            "${{ needs.singbox_test_cross.result }}"
          do
            if [[ "$state" != "success" && "$state" != "skipped" ]]; then
              echo "::error::检测到失败的构建任务: $state"
              echo "all_builds_ok=false" >> "$GITHUB_OUTPUT"
              echo "has_update=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done

          # ----------------------------------------------------
          # 判断是否至少有一个版本需要更新
          # ----------------------------------------------------

          has_update=false

          if [[ "${{ needs.puernya.outputs.puernya_skip_update }}" != "true" ]]; then
            has_update=true
          fi

          if [[ "${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_skip_update }}" != "true" ]]; then
            has_update=true
          fi

          if [[ "${{ needs.ref1nd_test_version.outputs.ref1nd_test_skip_update }}" != "true" ]]; then
            has_update=true
          fi

          if [[ "${{ needs.singbox_stable_version.outputs.singbox_stable_skip_update }}" != "true" ]]; then
            has_update=true
          fi

          if [[ "${{ needs.singbox_test_version.outputs.singbox_test_skip_update }}" != "true" ]]; then
            has_update=true
          fi

          echo "=================================================="
          echo "ALL FIVE VERSION CHECKS PASSED"
          echo "has_update=$has_update"
          echo "=================================================="

          echo "all_builds_ok=true" >> "$GITHUB_OUTPUT"
          echo "has_update=$has_update" >> "$GITHUB_OUTPUT"


  # ============================================================
  # ============================================================
  # RELEASE
  # ============================================================
  #
  # 必须满足：
  #
  # 1. build_gate success
  # 2. all_builds_ok == true
  # 3. 至少一个版本需要更新
  #
  # 所以：
  #
  # 五个版本全部没更新：
  #   -> Release skipped
  #
  # 任意一个版本 build failure：
  #   -> Release skipped
  #
  # 任意一个 version detection failure：
  #   -> Release skipped
  #
  # 五个版本全部：
  #   success / skipped
  #   且至少一个需要更新
  #
  #   -> Release
  #
  # ============================================================
  push_sing-box:
    runs-on: ubuntu-latest

    needs:
      - build_gate

    if: >
      ${{
        needs.build_gate.result == 'success' &&
        needs.build_gate.outputs.all_builds_ok == 'true' &&
        needs.build_gate.outputs.has_update == 'true'
      }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ref1nd_stable_VERSION: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_version }}
      ref1nd_stable_TIME: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_time }}

      ref1nd_test_VERSION: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_version }}
      ref1nd_test_TIME: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_time }}

      singbox_stable_VERSION: ${{ needs.singbox_stable_version.outputs.singbox_stable_version }}
      singbox_stable_TIME: ${{ needs.singbox_stable_version.outputs.singbox_stable_time }}

      singbox_test_VERSION: ${{ needs.singbox_test_version.outputs.singbox_test_version }}
      singbox_test_TIME: ${{ needs.singbox_test_version.outputs.singbox_test_time }}

      puernya_VERSION: ${{ needs.puernya.outputs.puernya_version }}
      puernya_TIME: ${{ needs.puernya.outputs.puernya_time }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Download all build artifacts
      # --------------------------------------------------------
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./tmp/

      # ========================================================
      # PuerNya
      # ========================================================
      - name: Package PuerNya
        if: ${{ needs.puernya.outputs.puernya_skip_update != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          declare -A sources=(
            [amd64]="sing-box-puernya-linux-amd64"
            [armv7]="sing-box-puernya-linux-armv7"
            [arm64]="sing-box-puernya-linux-arm64"
          )

          for arch in amd64 armv7 arm64; do

            src="./tmp/${sources[$arch]}/sing-box"

            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 PuerNya artifact: $src"
              exit 1
            fi

            workdir="./tmp/package-puernya-${arch}"

            rm -rf "$workdir"
            mkdir -p "$workdir"

            cp "$src" "$workdir/sing-box"
            chmod +x "$workdir/sing-box"

            tar \
              --no-same-owner \
              -czf "./sing-box/sing-box-puernya-linux-${arch}.tar.gz" \
              -C "$workdir" \
              sing-box

          done


      # ========================================================
      # reF1nd-Stable
      # ========================================================
      - name: Prepare reF1nd-Stable
        if: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_skip_update != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          linux_archs=(
            amd64-v1
            amd64-v3
            armv5
            armv6
            armv7
            arm64
            mips-softfloat
            mipsle-softfloat
            mipsle-hardfloat
          )

          for arch in "${linux_archs[@]}"; do

            src="./tmp/sing-box-ref1nd-stable-linux-${arch}/sing-box"
            dst="./sing-box/sing-box-ref1nd-stable-linux-${arch}.upx"

            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 reF1nd-Stable Linux artifact: $src"
              exit 1
            fi

            cp "$src" "$dst"
            chmod +x "$dst"

          done

          windows_archs=(
            amd64-v1
            amd64-v3
            arm64
          )

          for arch in "${windows_archs[@]}"; do

            src="./tmp/sing-box-ref1nd-stable-windows-${arch}/sing-box.exe"
            dst="./sing-box/sing-box-ref1nd-stable-windows-${arch}.exe"

            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 reF1nd-Stable Windows artifact: $src"
              exit 1
            fi

            cp "$src" "$dst"

          done


      # ========================================================
      # reF1nd-Test
      # ========================================================
      - name: Prepare reF1nd-Test
        if: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_skip_update != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          linux_archs=(
            amd64-v1
            amd64-v3
            armv5
            armv6
            armv7
            arm64
            mips-softfloat
            mipsle-softfloat
            mipsle-hardfloat
          )

          for arch in "${linux_archs[@]}"; do

            src="./tmp/sing-box-ref1nd-test-linux-${arch}/sing-box"
            dst="./sing-box/sing-box-ref1nd-test-linux-${arch}.upx"

            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 reF1nd-Test Linux artifact: $src"
              exit 1
            fi

            cp "$src" "$dst"
            chmod +x "$dst"

          done

          windows_archs=(
            amd64-v1
            amd64-v3
            arm64
          )

          for arch in "${windows_archs[@]}"; do

            src="./tmp/sing-box-ref1nd-test-windows-${arch}/sing-box.exe"
            dst="./sing-box/sing-box-ref1nd-test-windows-${arch}.exe"

            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 reF1nd-Test Windows artifact: $src"
              exit 1
            fi

            cp "$src" "$dst"

          done


      # ========================================================
      # sing-box Stable
      # ========================================================
      - name: Prepare sing-box Stable
        if: ${{ needs.singbox_stable_version.outputs.singbox_stable_skip_update != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          linux_archs=(
            amd64-v1
            amd64-v3
            armv5
            armv6
            armv7
            arm64
            mips-softfloat
            mipsle-softfloat
            mipsle-hardfloat
          )

          for arch in "${linux_archs[@]}"; do

            src="./tmp/sing-box-stable-linux-${arch}/sing-box"
            dst="./sing-box/sing-box-stable-linux-${arch}.upx"

            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 sing-box Stable Linux artifact: $src"
              exit 1
            fi

            cp "$src" "$dst"
            chmod +x "$dst"

          done

          windows_archs=(
            amd64-v1
            amd64-v3
            arm64
          )

          for arch in "${windows_archs[@]}"; do

            src="./tmp/sing-box-stable-windows-${arch}/sing-box.exe"
            dst="./sing-box/sing-box-stable-windows-${arch}.exe"

            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 sing-box Stable Windows artifact: $src"
              exit 1
            fi

            cp "$src" "$dst"

          done


      # ========================================================
      # sing-box Test
      # ========================================================
      - name: Prepare sing-box Test
        if: ${{ needs.singbox_test_version.outputs.singbox_test_skip_update != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          linux_archs=(
            amd64-v1
            amd64-v3
            armv5
            armv6
            armv7
            arm64
            mips-softfloat
            mipsle-softfloat
            mipsle-hardfloat
          )

          for arch in "${linux_archs[@]}"; do

            src="./tmp/sing-box-test-linux-${arch}/sing-box"
            dst="./sing-box/sing-box-test-linux-${arch}.upx"

            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 sing-box Test Linux artifact: $src"
              exit 1
            fi

            cp "$src" "$dst"
            chmod +x "$dst"

          done

          windows_archs=(
            amd64-v1
            amd64-v3
            arm64
          )

          for arch in "${windows_archs[@]}"; do

            src="./tmp/sing-box-test-windows-${arch}/sing-box.exe"
            dst="./sing-box/sing-box-test-windows-${arch}.exe"

            if [[ ! -f "$src" ]]; then
              echo "::error::缺少 sing-box Test Windows artifact: $src"
              exit 1
            fi

            cp "$src" "$dst"

          done


      # ========================================================
      # UPX
      # ========================================================
      - name: Setup UPX
        if: >
          ${{
            needs.ref1nd_stable_version.outputs.ref1nd_stable_skip_update != 'true' ||
            needs.ref1nd_test_version.outputs.ref1nd_test_skip_update != 'true' ||
            needs.singbox_stable_version.outputs.singbox_stable_skip_update != 'true' ||
            needs.singbox_test_version.outputs.singbox_test_skip_update != 'true'
          }}
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          files: ./sing-box/*.upx


      # ========================================================
      # 最终资产检查
      # ========================================================
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Release assets:"
          find ./sing-box -maxdepth 1 -type f -printf '%f\n' | sort

          if ! compgen -G "./sing-box/*" > /dev/null; then
            echo "::error::没有生成任何 Release 文件"
            exit 1
          fi

          count="$(find ./sing-box -maxdepth 1 -type f | wc -l)"

          if [[ "$count" -le 0 ]]; then
            echo "::error::Release 文件数量为 0"
            exit 1
          fi

          echo "检测到 $count 个 Release 文件"


      # ========================================================
      # Generate Release Notes
      # ========================================================
      - name: Generate Release Notes
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          # 📝 sing-box Core

          ## 版本信息

          1. **sing-box PuerNya**
             - Version: v${puernya_VERSION}
             - Date: ${puernya_TIME}

          2. **sing-box reF1nd-Stable**
             - Version: v${ref1nd_stable_VERSION}
             - Date: ${ref1nd_stable_TIME}

          3. **sing-box reF1nd-Test**
             - Version: v${ref1nd_test_VERSION}
             - Date: ${ref1nd_test_TIME}

          4. **sing-box Stable**
             - Version: v${singbox_stable_VERSION}
             - Date: ${singbox_stable_TIME}

          5. **sing-box Test**
             - Version: v${singbox_test_VERSION}
             - Date: ${singbox_test_TIME}

          ---

          本次 Release 仅在全部版本满足：

          - 已更新版本：所有目标架构构建成功
          - 未更新版本：构建任务自动跳过
          - 所有构建任务均通过最终 Build Gate

          后生成。

          EOF


      # ========================================================
      # Create / Update Release
      #
      # 使用 GitHub CLI，避免第三方 Release Action 对已有
      # Release 的行为不确定。
      #
      # gh release create / upload / edit 均为官方 GitHub CLI。
      # ========================================================
      - name: Create or update Release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view sing-box >/dev/null 2>&1; then

            echo "Release sing-box 已存在，更新 Release Notes"

            gh release edit sing-box \
              --title "sing-box" \
              --notes-file release-notes.md

          else

            echo "Release sing-box 不存在，创建 Release"

            gh release create sing-box \
              --title "sing-box" \
              --notes-file release-notes.md

          fi


      # ========================================================
      # Upload Release assets
      # ========================================================
      - name: Upload Release assets
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          files=(./sing-box/*)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::没有 Release assets"
            exit 1
          fi

          gh release upload \
            sing-box \
            "${files[@]}" \
            --clobber

          echo "Release assets upload completed"


      # ========================================================
      # Verify Release
      # ========================================================
      - name: Verify Release
        shell: bash
        run: |
          set -euo pipefail

          gh release view sing-box

          echo "Release 更新完成"


  # ============================================================
  # ============================================================
  # README
  # ============================================================
  #
  # README 的权限链：
  #
  # build_gate
  #      ↓
  # push_sing-box
  #      ↓
  # Update_Readme
  #
  # 所以：
  #
  # 任意 build failure
  #       ↓
  # build_gate failure
  #       ↓
  # Release 不执行
  #       ↓
  # README 不执行
  #
  # 五个版本全部没有更新
  #       ↓
  # build_gate success
  # has_update=false
  #       ↓
  # Release skipped
  #       ↓
  # README skipped
  #
  # ============================================================
  Update_Readme:
    runs-on: ubuntu-latest

    needs:
      - build_gate
      - push_sing-box

    if: >
      ${{
        needs.build_gate.result == 'success' &&
        needs.build_gate.outputs.all_builds_ok == 'true' &&
        needs.build_gate.outputs.has_update == 'true' &&
        needs.push_sing-box.result == 'success'
      }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ========================================================
      # Generate README
      # ========================================================
      - name: Generate README
        shell: bash
        run: |
          set -euo pipefail

          cat > README.md <<EOF
          # Sing-Box核心编译

          ## sing-box 内核 PuerNya 版

          \`\`\`bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-puernya-linux-amd64.tar.gz | tar -zx -C /usr/local/bin
          \`\`\`

          ## sing-box 内核 reF1nd-Stable 版

          \`\`\`bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3.upx -o /usr/local/bin/sing-box
          chmod +x /usr/local/bin/sing-box
          \`\`\`

          ## Changelog

          1. **sing-box PuerNya**
             - v${{ needs.puernya.outputs.puernya_version }}
             - ${{ needs.puernya.outputs.puernya_time }}

          2. **sing-box reF1nd-Stable**
             - v${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_version }}
             - ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_time }}

          3. **sing-box reF1nd-Test**
             - v${{ needs.ref1nd_test_version.outputs.ref1nd_test_version }}
             - ${{ needs.ref1nd_test_version.outputs.ref1nd_test_time }}

          4. **sing-box Stable**
             - v${{ needs.singbox_stable_version.outputs.singbox_stable_version }}
             - ${{ needs.singbox_stable_version.outputs.singbox_stable_time }}

          5. **sing-box Test**
             - v${{ needs.singbox_test_version.outputs.singbox_test_version }}
             - ${{ needs.singbox_test_version.outputs.singbox_test_time }}

          EOF


      # ========================================================
      # Commit README
      # ========================================================
      - name: Commit README
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README 没有变化，无需提交"
            exit 0
          fi

          git commit -m "Update README"

          # ----------------------------------------------------
          # 同步最新 main
          #
          # 由于整个 workflow 已经有 concurrency，
          # 这里进一步防止其他 main 提交导致 fetch first。
          # ----------------------------------------------------

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main