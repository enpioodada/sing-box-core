            curl -fsSL \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          version="${{ steps.version.outputs.version }}"

          if grep -Fq "$version" <<< "$body"; then
            echo "sing-box Stable 无需更新"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "sing-box Stable 需要更新"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi


# ============================================================
# sing-box Test
# ============================================================
  singbox_test:
    runs-on: ubuntu-latest
    needs: go

    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}

    steps:
      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "tags=with_quic,with_utls,with_clash_api" >> "$GITHUB_OUTPUT"

          releases="$(
            curl -fsSL \
              "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=100"
          )"

          version="$(
            jq -r '
              .[]
              | select(.tag_name | test("^v[0-9].*(alpha|beta|rc)"))
              | .tag_name
            ' <<< "$releases" |
            head -n1
          )"

          published="$(
            jq -r '
              .[]
              | select(.tag_name | test("^v[0-9].*(alpha|beta|rc)"))
              | (.published_at // .created_at)
            ' <<< "$releases" |
            head -n1
          )"

          [[ -n "$version" && "$version" != "null" ]]
          [[ -n "$published" && "$published" != "null" ]]

          version="${version#v}"
          time="$(date -d "$published +8 hours" '+%Y-%m-%d')"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"

          echo "sing-box Test: $version ($time)"

      - name: Compare
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          body="$(
            curl -fsSL \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
