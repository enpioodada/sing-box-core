# ============================================================
# PuerNya build
# 4 jobs
# ============================================================
  build_puernya:
    runs-on: ubuntu-latest
    needs:
      - go
      - puernya

    if: ${{ needs.puernya.outputs.skip != 'true' }}

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64-v1
          - amd64-v3
          - armv7
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: PuerNya/sing-box
          ref: building

      - name: Fix sniff
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/sniffHosts/sniffHost/' \
            ./experimental/clashapi/trafficontrol/tracker.go

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go.outputs.version }}

      - name: Build
        shell: bash
        env:
          VERSION: ${{ needs.puernya.outputs.version }}
          TAGS: ${{ needs.puernya.outputs.tags }}
        run: |
          set -euo pipefail

          case "${{ matrix.arch }}" in
            amd64-v1)
              export GOOS=linux
              export GOARCH=amd64
              export GOAMD64=v1
              ;;
            amd64-v3)
              export GOOS=linux
              export GOARCH=amd64
              export GOAMD64=v3
              ;;
            armv7)
              export GOOS=linux
              export GOARCH=arm
              export GOARM=7
              ;;
            arm64)
              export GOOS=linux
              export GOARCH=arm64
              ;;
          esac

          export CGO_ENABLED=0

          go build \
            -v \
            -trimpath \
            -ldflags "-checklinkname=0 -X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "$TAGS" \
            ./cmd/sing-box

          test -f sing-box

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: puernya-${{ matrix.arch }}
          path: sing-box
          if-no-files-found: error


