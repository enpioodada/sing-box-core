```yaml
name: Update sing-box

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/workflows/delete-old-workflows.yml"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

# 防止 schedule / workflow_dispatch / push 同时运行造成 Release、README、git push 冲突
concurrency:
  group: update-sing-box
  cancel-in-progress: false


# ============================================================
# ============================================================
# Get latest Go
# ============================================================
# ============================================================

jobs:

  go:
    runs-on: ubuntu-latest

    outputs:
      go_version: ${{ steps.go.outputs.version }}

    steps:
      - name: Get latest Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json |
            jq -r '.[0].version'
          )"

          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::无法获取 Go 版本"
            exit 1
          fi

          echo "Go version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"


# ============================================================
# ============================================================
# 1. PuerNya
# ============================================================
# ============================================================

  puernya:
    runs-on: ubuntu-latest
    needs: go

    outputs:
      puernya_version: ${{ steps.version.outputs.version }}
      puernya_time: ${{ steps.version.outputs.time }}
      puernya_tags: ${{ steps.version.outputs.tags }}
      puernya_skip_update: ${{ steps.compare.outputs.skip_update }}

    steps:

      - name: Checkout PuerNya/building
        uses: actions/checkout@v7
        with:
          repository: PuerNya/sing-box
          ref: building
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Get PuerNya version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git remote add sekai https://github.com/SagerNet/sing-box.git || true
          git fetch --tags sekai

          version="$(
            CGO_ENABLED=0 go run ./cmd/internal/read_tag
          )"

          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::无法获取 PuerNya 版本"
            exit 1
          fi

          ver_commit="$(echo "$version" | awk -F '-' '{print $3}')"

          if [[ -z "$ver_commit" ]]; then
            echo "::error::无法从 PuerNya 版本中解析 commit"
            exit 1
          fi

          time="$(
            git log -1 \
              --format=%cd \
              --date=format:'%Y-%m-%d' \
              "$ver_commit"
          )"

          if [[ -z "$time" ]]; then
            echo "::error::无法获取 PuerNya 发布时间"
            exit 1
          fi

          tags="with_quic,with_dhcp,with_wireguard,with_shadowsocksr,with_ech,with_utls,with_clash_api,with_gvisor"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

          echo "PuerNya version: $version"
          echo "PuerNya time: $time"
          echo "PuerNya tags: $tags"

      - name: Compare PuerNya version
        id: compare
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          current_body="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          if grep -Fq "$VERSION" <<< "$current_body"; then
            echo "PuerNya 已是最新版本"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "PuerNya 需要更新"
            echo "skip_update=false" >> "$GITHUB_OUTPUT"
          fi


  puernya_cross:
    runs-on: ubuntu-latest

    needs:
      - go
      - puernya

    if: ${{ needs.puernya.outputs.puernya_skip_update != 'true' }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            goamd64: v1

          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7

          - name: linux-arm64
            goos: linux
            goarch: arm64

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goadm64 }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0

      VERSION: ${{ needs.puernya.outputs.puernya_version }}
      TAGS: ${{ needs.puernya.outputs.puernya_tags }}

    steps:

      - name: Checkout PuerNya/building
        uses: actions/checkout@v7
        with:
          repository: PuerNya/sing-box
          ref: building

      - name: Fix sniff
        shell: bash
        run: |
          set -euo pipefail

          file="./experimental/clashapi/trafficontrol/tracker.go"

          if [[ -f "$file" ]]; then
            sed -i 's/sniffHosts/sniffHost/g' "$file"
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build PuerNya
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-checklinkname=0 -X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${TAGS}" \
            ./cmd/sing-box

          test -f sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-puernya-${{ matrix.name }}
          path: sing-box
          if-no-files-found: error


# ============================================================
# ============================================================
# 2. reF1nd Stable
# ============================================================
# ============================================================

  ref1nd_stable_version:
    runs-on: ubuntu-latest
    needs: go

    outputs:
      ref1nd_stable_version: ${{ steps.version.outputs.version }}
      ref1nd_stable_time: ${{ steps.version.outputs.time }}
      ref1nd_stable_linux_tags: ${{ steps.version.outputs.linux_tags }}
      ref1nd_stable_windows_tags: ${{ steps.version.outputs.windows_tags }}
      ref1nd_stable_skip_update: ${{ steps.compare.outputs.skip_update }}

    steps:

      - name: Get reF1nd-Stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # ==================================================
          # 重要：
          # TAGS 在进入循环前就写入 GITHUB_OUTPUT。
          #
          # 不放在 exit/break 后面。
          # ==================================================

          linux_tags="with_quic,with_utls,with_clash_api"
          windows_tags="with_gvisor,with_quic,with_utls,with_clash_api,with_tailscale"

          echo "linux_tags=$linux_tags" >> "$GITHUB_OUTPUT"
          echo "windows_tags=$windows_tags" >> "$GITHUB_OUTPUT"

          found=false

          # 最多重试 6 次，避免 API 永久异常导致 workflow 无限运行
          for retry in {1..6}; do

            echo "开始获取 reF1nd-Stable，第 ${retry}/6 次"

            for page in {1..10}; do

              echo "检查 tags 第 ${page} 页"

              tags="$(
                curl -fsSL \
                  --retry 5 \
                  --retry-delay 2 \
                  --retry-all-errors \
                  "https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100&page=${page}"
              )"

              # API 返回空数组，说明已经没有下一页
              if [[ "$(jq 'length' <<< "$tags")" -eq 0 ]]; then
                echo "第 ${page} 页为空，结束本轮分页搜索"
                break
              fi

              version="$(
                jq -r '.[].name' <<< "$tags" |
                grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+-reF1nd([.-].*)?$' |
                head -n 1 || true
              )"

              if [[ -n "$version" && "$version" != "null" ]]; then

                echo "成功获取 reF1nd-Stable: $version"

                commit_date="$(
                  curl -fsSL \
                    --retry 5 \
                    --retry-delay 2 \
                    --retry-all-errors \
                    "https://api.github.com/repos/reF1nd/sing-box/commits/${version}" |
                  jq -r '.commit.committer.date'
                )"

                if [[ -z "$commit_date" || "$commit_date" == "null" ]]; then
                  echo "::error::无法获取 ${version} 的 commit 时间"
                  exit 1
                fi

                # GitHub 时间 → 中国时间
                time="$(
                  date -u -d "$commit_date" '+%Y-%m-%d' 2>/dev/null
                )"

                echo "version=$version" >> "$GITHUB_OUTPUT"
                echo "time=$time" >> "$GITHUB_OUTPUT"

                found=true
                break
              fi

            done

            if [[ "$found" == "true" ]]; then
              break
            fi

            echo "本轮没有找到 reF1nd-Stable，30 秒后重试"
            sleep 30

          done

          if [[ "$found" != "true" ]]; then
            echo "::error::连续 6 次都没有找到 reF1nd-Stable 版本"
            exit 1
          fi

      - name: Compare reF1nd-Stable
        id: compare
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          current_body="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          if grep -Fq "$VERSION" <<< "$current_body"; then
            echo "reF1nd-Stable 已是最新版本"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "reF1nd-Stable 需要更新"
            echo "skip_update=false" >> "$GITHUB_OUTPUT"
          fi


  ref1nd_stable_cross:
    runs-on: ubuntu-latest

    needs:
      - ref1nd_stable_version

    if: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_skip_update != 'true' }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }

          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0

      VERSION: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_version }}
      LINUX_TAGS: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_linux_tags }}
      WINDOWS_TAGS: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_windows_tags }}

    steps:

      - name: Checkout reF1nd-stable
        uses: actions/checkout@v7
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-stable

      - name: Get Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-stable/.github/workflows/build.yml |
            grep -E 'go-version:' |
            head -n 1 |
            awk '{print $2}'
          )"

          if [[ -z "$version" ]]; then
            echo "::error::无法获取 reF1nd-Stable Go 版本"
            exit 1
          fi

          echo "go_version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.go_version }}

      - name: Build Linux
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${LINUX_TAGS}" \
            ./cmd/sing-box

          test -f sing-box

      - name: Build Windows
        if: ${{ matrix.goos == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${WINDOWS_TAGS}" \
            ./cmd/sing-box

          test -f sing-box.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-ref1nd-stable-${{ matrix.name }}
          path: |
            sing-box
            sing-box.exe
          if-no-files-found: error


