                    "https://api.github.com/repos/reF1nd/sing-box/commits/${version}" |
                  jq -r '.commit.committer.date'
                )"

                if [[ -z "$commit_date" || "$commit_date" == "null" ]]; then
                  echo "::error::无法获取 ${version} commit 时间"
                  exit 1
                fi

                time="$(
                  date -u -d "$commit_date" '+%Y-%m-%d'
                )"

                # 去掉 v，保持原工作流 Release 格式
                version_without_v="${version#v}"

                echo "version=$version_without_v" >> "$GITHUB_OUTPUT"
                echo "time=$time" >> "$GITHUB_OUTPUT"

                found=true
