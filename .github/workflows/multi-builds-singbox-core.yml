# ============================================================
# ============================================================
# 4. sing-box Stable
# ============================================================
# ============================================================

  singbox_stable_version:
    runs-on: ubuntu-latest
    needs: go

    outputs:
      singbox_stable_version: ${{ steps.version.outputs.version }}
      singbox_stable_time: ${{ steps.version.outputs.time }}
      singbox_stable_linux_tags: ${{ steps.version.outputs.linux_tags }}
      singbox_stable_windows_tags: ${{ steps.version.outputs.windows_tags }}
      singbox_stable_skip_update: ${{ steps.compare.outputs.skip_update }}

    steps:

      - name: Get sing-box Stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          linux_tags="with_quic,with_utls,with_clash_api"
          windows_tags="with_gvisor,with_quic,with_utls,with_clash_api,with_tailscale"

          echo "linux_tags=$linux_tags" >> "$GITHUB_OUTPUT"
          echo "windows_tags=$windows_tags" >> "$GITHUB_OUTPUT"

          latest="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest
          )"

          version="$(
            jq -r '.tag_name // empty' <<< "$latest" |
            sed 's/^v//'
          )"

          time="$(
            jq -r '.published_at // .created_at // empty' <<< "$latest" |
            xargs -I {} date -u -d '{}' '+%Y-%m-%d'
          )"

          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::无法获取 sing-box Stable 版本"
            exit 1
          fi

          if [[ -z "$time" ]]; then
            echo "::error::无法获取 sing-box Stable 发布时间"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"

          echo "sing-box Stable: $version"

      - name: Compare sing-box Stable
        id: compare
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          current_body="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          if grep -Fq "$VERSION" <<< "$current_body"; then
            echo "sing-box Stable 已是最新版本"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "sing-box Stable 需要更新"
            echo "skip_update=false" >> "$GITHUB_OUTPUT"
          fi


  singbox_stable_cross:
    runs-on: ubuntu-latest

    needs:
      - singbox_stable_version

    if: ${{ needs.singbox_stable_version.outputs.singbox_stable_skip_update != 'true' }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }

          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0

      VERSION: ${{ needs.singbox_stable_version.outputs.singbox_stable_version }}
      LINUX_TAGS: ${{ needs.singbox_stable_version.outputs.singbox_stable_linux_tags }}
      WINDOWS_TAGS: ${{ needs.singbox_stable_version.outputs.singbox_stable_windows_tags }}

    steps:

      - name: Checkout SagerNet/stable
        uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box
          ref: stable

      - name: Get Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://raw.githubusercontent.com/SagerNet/sing-box/stable/.github/workflows/build.yml |
            grep -E 'go-version:' |
            head -n 1 |
            awk '{print $2}'
          )"

          if [[ -z "$version" ]]; then
            echo "::error::无法获取 sing-box Stable Go 版本"
            exit 1
          fi

          echo "go_version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.go_version }}

      - name: Build Linux
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${LINUX_TAGS}" \
            ./cmd/sing-box

          test -f sing-box

      - name: Build Windows
        if: ${{ matrix.goos == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${WINDOWS_TAGS}" \
            ./cmd/sing-box

          test -f sing-box.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-stable-${{ matrix.name }}
          path: |
            sing-box
            sing-box.exe
          if-no-files-found: error


# ============================================================
# ============================================================
# 5. sing-box Test
# ============================================================
# ============================================================

  singbox_test_version:
    runs-on: ubuntu-latest
    needs: go

    outputs:
      singbox_test_version: ${{ steps.version.outputs.version }}
      singbox_test_time: ${{ steps.version.outputs.time }}
      singbox_test_linux_tags: ${{ steps.version.outputs.linux_tags }}
      singbox_test_windows_tags: ${{ steps.version.outputs.windows_tags }}
      singbox_test_skip_update: ${{ steps.compare.outputs.skip_update }}

    steps:

      - name: Get sing-box Test version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          linux_tags="with_quic,with_utls,with_clash_api"
          windows_tags="with_gvisor,with_quic,with_utls,with_clash_api,with_tailscale"

          echo "linux_tags=$linux_tags" >> "$GITHUB_OUTPUT"
          echo "windows_tags=$windows_tags" >> "$GITHUB_OUTPUT"

          found=false

          for retry in {1..6}; do

            echo "获取 sing-box Test，第 ${retry}/6 次"

            for page in {1..10}; do

              releases="$(
                curl -fsSL \
                  --retry 5 \
                  --retry-delay 2 \
                  --retry-all-errors \
                  "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=100&page=${page}"
              )"

              if [[ "$(jq 'length' <<< "$releases")" -eq 0 ]]; then
                break
              fi

              data="$(
                jq -r '
                  .[]
                  | select(.prerelease == true)
                  | select(.tag_name | test("alpha|beta|rc"; "i"))
                  | [
                      .tag_name,
                      (.published_at // .created_at)
                    ]
                  | @tsv
                ' <<< "$releases" |
                head -n 1 || true
              )"

              if [[ -n "$data" ]]; then

                version="$(cut -f1 <<< "$data" | sed 's/^v//')"
                time_raw="$(cut -f2 <<< "$data")"

                time="$(
                  date -u -d "$time_raw" '+%Y-%m-%d'
                )"

                if [[ -z "$version" ]]; then
                  echo "::error::sing-box Test 版本为空"
                  exit 1
                fi

                echo "找到 sing-box Test: $version"

                echo "version=$version" >> "$GITHUB_OUTPUT"
                echo "time=$time" >> "$GITHUB_OUTPUT"

                found=true
                break
              fi

            done

            if [[ "$found" == "true" ]]; then
              break
            fi

            echo "本轮没有找到 sing-box Test，30 秒后重试"
            sleep 30

          done

          if [[ "$found" != "true" ]]; then
            echo "::error::连续 6 次都没有找到 sing-box Test"
            exit 1
          fi

      - name: Compare sing-box Test
        id: compare
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          current_body="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          if grep -Fq "$VERSION" <<< "$current_body"; then
            echo "sing-box Test 已是最新版本"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "sing-box Test 需要更新"
            echo "skip_update=false" >> "$GITHUB_OUTPUT"
          fi


  singbox_test_cross:
    runs-on: ubuntu-latest

    needs:
      - singbox_test_version

    if: ${{ needs.singbox_test_version.outputs.singbox_test_skip_update != 'true' }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }

          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0

      VERSION: ${{ needs.singbox_test_version.outputs.singbox_test_version }}
      LINUX_TAGS: ${{ needs.singbox_test_version.outputs.singbox_test_linux_tags }}
      WINDOWS_TAGS: ${{ needs.singbox_test_version.outputs.singbox_test_windows_tags }}

    steps:

      - name: Checkout SagerNet/testing
        uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box
          ref: testing

      - name: Get Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://raw.githubusercontent.com/SagerNet/sing-box/testing/.github/workflows/build.yml |
            grep -E 'go-version:' |
            head -n 1 |
            awk '{print $2}'
          )"

          if [[ -z "$version" ]]; then
            echo "::error::无法获取 sing-box Test Go 版本"
            exit 1
          fi

          echo "go_version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.go_version }}

      - name: Build Linux
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${LINUX_TAGS}" \
            ./cmd/sing-box

          test -f sing-box

      - name: Build Windows
        if: ${{ matrix.goos == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${WINDOWS_TAGS}" \
            ./cmd/sing-box

          test -f sing-box.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-test-${{ matrix.name }}
          path: |
            sing-box
            sing-box.exe
          if-no-files-found: error


# ============================================================
# ============================================================
# FINAL RELEASE GATE
# ============================================================
# ============================================================
#
# 五个版本必须满足：
#
# A. version job = success
#
# 且
#
# B. cross job = success
#    或
#    cross job = skipped（说明无需更新）
#
# 任意一个 failure：
#     禁止 Release
#     禁止 README
#
# ============================================================

  push_sing_box:
    runs-on: ubuntu-latest

    needs:
      - puernya
      - puernya_cross

      - ref1nd_stable_version
      - ref1nd_stable_cross

      - ref1nd_test_version
      - ref1nd_test_cross

      - singbox_stable_version
      - singbox_stable_cross

      - singbox_test_version
      - singbox_test_cross

    if: >
      ${{
        always() &&

        needs.puernya.result == 'success' &&
        (needs.puernya_cross.result == 'success' ||
         needs.puernya_cross.result == 'skipped') &&

        needs.ref1nd_stable_version.result == 'success' &&
        (needs.ref1nd_stable_cross.result == 'success' ||
         needs.ref1nd_stable_cross.result == 'skipped') &&

        needs.ref1nd_test_version.result == 'success' &&
        (needs.ref1nd_test_cross.result == 'success' ||
         needs.ref1nd_test_cross.result == 'skipped') &&

        needs.singbox_stable_version.result == 'success' &&
        (needs.singbox_stable_cross.result == 'success' ||
         needs.singbox_stable_cross.result == 'skipped') &&

        needs.singbox_test_version.result == 'success' &&
        (needs.singbox_test_cross.result == 'success' ||
         needs.singbox_test_cross.result == 'skipped')
      }}

    env:
      PUERNYA_VERSION: ${{ needs.puernya.outputs.puernya_version }}
      PUERNYA_TIME: ${{ needs.puernya.outputs.puernya_time }}
      PUERNYA_SKIP: ${{ needs.puernya.outputs.puernya_skip_update }}

      REF1ND_STABLE_VERSION: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_version }}
      REF1ND_STABLE_TIME: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_time }}
      REF1ND_STABLE_SKIP: ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_skip_update }}

      REF1ND_TEST_VERSION: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_version }}
      REF1ND_TEST_TIME: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_time }}
      REF1ND_TEST_SKIP: ${{ needs.ref1nd_test_version.outputs.ref1nd_test_skip_update }}

      SINGBOX_STABLE_VERSION: ${{ needs.singbox_stable_version.outputs.singbox_stable_version }}
      SINGBOX_STABLE_TIME: ${{ needs.singbox_stable_version.outputs.singbox_stable_time }}
      SINGBOX_STABLE_SKIP: ${{ needs.singbox_stable_version.outputs.singbox_stable_skip_update }}

      SINGBOX_TEST_VERSION: ${{ needs.singbox_test_version.outputs.singbox_test_version }}
      SINGBOX_TEST_TIME: ${{ needs.singbox_test_version.outputs.singbox_test_time }}
      SINGBOX_TEST_SKIP: ${{ needs.singbox_test_version.outputs.singbox_test_skip_update }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ========================================================
      # 输出最终状态
      # ========================================================

      - name: Verify all five versions
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final build gate"
          echo "========================================"

          echo "PuerNya:"
          echo "  version = ${PUERNYA_VERSION}"
          echo "  skip    = ${PUERNYA_SKIP}"

          echo "reF1nd-Stable:"
          echo "  version = ${REF1ND_STABLE_VERSION}"
          echo "  skip    = ${REF1ND_STABLE_SKIP}"

          echo "reF1nd-Test:"
          echo "  version = ${REF1ND_TEST_VERSION}"
          echo "  skip    = ${REF1ND_TEST_SKIP}"

          echo "sing-box Stable:"
          echo "  version = ${SINGBOX_STABLE_VERSION}"
          echo "  skip    = ${SINGBOX_STABLE_SKIP}"

          echo "sing-box Test:"
          echo "  version = ${SINGBOX_TEST_VERSION}"
          echo "  skip    = ${SINGBOX_TEST_SKIP}"

          echo "========================================"
          echo "All five version checks/build gates passed."
          echo "========================================"

      # ========================================================
      # 下载 artifact
      #
      # 只有实际更新的版本才会有 artifact。
      # ========================================================

      - name: Download artifacts
        if: >
          ${{
            env.PUERNYA_SKIP != 'true' ||
            env.REF1ND_STABLE_SKIP != 'true' ||
            env.REF1ND_TEST_SKIP != 'true' ||
            env.SINGBOX_STABLE_SKIP != 'true' ||
            env.SINGBOX_TEST_SKIP != 'true'
          }}
        uses: actions/download-artifact@v8
        with:
          path: ./tmp

      # ========================================================
      # Prepare PuerNya
      # ========================================================

      - name: Package PuerNya
        if: ${{ env.PUERNYA_SKIP != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          declare -A files=(
            [amd64]="linux-amd64"
            [armv7]="linux-armv7"
            [arm64]="linux-arm64"
          )

          for arch in "${!files[@]}"; do

            src="./tmp/sing-box-puernya-${files[$arch]}/sing-box"
            dst="./tmp/sing-box"

            test -f "$src"

            cp -f "$src" "$dst"
            chmod +x "$dst"

            tar \
              --no-same-owner \
              -czf "./sing-box/sing-box-puernya-linux-${arch}.tar.gz" \
              -C ./tmp \
              sing-box

          done

      # ========================================================
      # Prepare reF1nd Stable
      # ========================================================

      - name: Package reF1nd-Stable
        if: ${{ env.REF1ND_STABLE_SKIP != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          linux_archs=(
            amd64-v1
            amd64-v3
            armv5
            armv6
            armv7
            arm64
            mips-softfloat
            mipsle-softfloat
            mipsle-hardfloat
          )

          for arch in "${linux_archs[@]}"; do

            src="./tmp/sing-box-ref1nd-stable-linux-${arch}/sing-box"
            dst="./sing-box/sing-box-ref1nd-stable-linux-${arch}.upx"

            test -f "$src"

            cp -f "$src" "$dst"
            chmod +x "$dst"

          done

          windows_archs=(
            amd64-v1
            amd64-v3
            arm64
          )

          for arch in "${windows_archs[@]}"; do

            src="./tmp/sing-box-ref1nd-stable-windows-${arch}/sing-box.exe"
            dst="./sing-box/sing-box-ref1nd-stable-windows-${arch}.exe"

            test -f "$src"

            cp -f "$src" "$dst"

          done

      # ========================================================
      # Prepare reF1nd Test
      # ========================================================

      - name: Package reF1nd-Test
        if: ${{ env.REF1ND_TEST_SKIP != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          linux_archs=(
            amd64-v1
            amd64-v3
            armv5
            armv6
            armv7
            arm64
            mips-softfloat
            mipsle-softfloat
            mipsle-hardfloat
          )

          for arch in "${linux_archs[@]}"; do

            src="./tmp/sing-box-ref1nd-test-linux-${arch}/sing-box"
            dst="./sing-box/sing-box-ref1nd-test-linux-${arch}.upx"

            test -f "$src"

            cp -f "$src" "$dst"
            chmod +x "$dst"

          done

          windows_archs=(
            amd64-v1
            amd64-v3
            arm64
          )

          for arch in "${windows_archs[@]}"; do

            src="./tmp/sing-box-ref1nd-test-windows-${arch}/sing-box.exe"
            dst="./sing-box/sing-box-ref1nd-test-windows-${arch}.exe"

            test -f "$src"

            cp -f "$src" "$dst"

          done

      # ========================================================
      # Prepare sing-box Stable
      # ========================================================

      - name: Package sing-box Stable
        if: ${{ env.SINGBOX_STABLE_SKIP != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          linux_archs=(
            amd64-v1
            amd64-v3
            armv5
            armv6
            armv7
            arm64
            mips-softfloat
            mipsle-softfloat
            mipsle-hardfloat
          )

          for arch in "${linux_archs[@]}"; do

            src="./tmp/sing-box-stable-linux-${arch}/sing-box"
            dst="./sing-box/sing-box-stable-linux-${arch}.upx"

            test -f "$src"

            cp -f "$src" "$dst"
            chmod +x "$dst"

          done

          windows_archs=(
            amd64-v1
            amd64-v3
            arm64
          )

          for arch in "${windows_archs[@]}"; do

            src="./tmp/sing-box-stable-windows-${arch}/sing-box.exe"
            dst="./sing-box/sing-box-stable-windows-${arch}.exe"

            test -f "$src"

            cp -f "$src" "$dst"

          done

      # ========================================================
      # Prepare sing-box Test
      # ========================================================

      - name: Package sing-box Test
        if: ${{ env.SINGBOX_TEST_SKIP != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          linux_archs=(
            amd64-v1
            amd64-v3
            armv5
            armv6
            armv7
            arm64
            mips-softfloat
            mipsle-softfloat
            mipsle-hardfloat
          )

          for arch in "${linux_archs[@]}"; do

            src="./tmp/sing-box-test-linux-${arch}/sing-box"
            dst="./sing-box/sing-box-test-linux-${arch}.upx"

            test -f "$src"

            cp -f "$src" "$dst"
            chmod +x "$dst"

          done

          windows_archs=(
            amd64-v1
            amd64-v3
            arm64
          )

          for arch in "${windows_archs[@]}"; do

            src="./tmp/sing-box-test-windows-${arch}/sing-box.exe"
            dst="./sing-box/sing-box-test-windows-${arch}.exe"

            test -f "$src"

            cp -f "$src" "$dst"

          done

      # ========================================================
      # UPX
      # ========================================================

      - name: Setup UPX
        if: >
          ${{
            env.REF1ND_STABLE_SKIP != 'true' ||
            env.REF1ND_TEST_SKIP != 'true' ||
            env.SINGBOX_STABLE_SKIP != 'true' ||
            env.SINGBOX_TEST_SKIP != 'true'
          }}
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          files: ./sing-box/*.upx

      # ========================================================
      # Final artifact check
      # ========================================================

      - name: Verify release files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          if ! compgen -G "./sing-box/*" > /dev/null; then
            echo "没有任何新 artifact。"
            echo "本次五个版本全部无需更新。"
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "检测到以下 Release 文件："
          find ./sing-box -maxdepth 1 -type f -printf '%f\n' | sort

          echo "release_needed=true" >> "$GITHUB_OUTPUT"

      # ========================================================
      # Release
      #
      # 只有五个版本全部通过最终 gate，
      # 且确实存在新文件时才更新 Release。
      # ========================================================

      - name: Release and upload sing-box assets
        if: ${{ steps.files.outputs.release_needed == 'true' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box
          tag: sing-box
          overwrite: true
          body: |
            # 📝 Release Notes

            1. 更新 [sing-box PuerNya 版](https://github.com/PuerNya/sing-box/tree/building) 至 v${{ env.PUERNYA_VERSION }}，发布于 ${{ env.PUERNYA_TIME }}

            2. 更新 [sing-box reF1nd-Stable 版](https://github.com/reF1nd/sing-box/tree/reF1nd-stable) 至 v${{ env.REF1ND_STABLE_VERSION }}，发布于 ${{ env.REF1ND_STABLE_TIME }}

            3. 更新 [sing-box reF1nd-Test 版](https://github.com/reF1nd/sing-box/tree/reF1nd-testing) 至 v${{ env.REF1ND_TEST_VERSION }}，发布于 ${{ env.REF1ND_TEST_TIME }}

            4. 更新 [sing-box Stable 版](https://github.com/SagerNet/sing-box/tree/stable) 至 v${{ env.SINGBOX_STABLE_VERSION }}，发布于 ${{ env.SINGBOX_STABLE_TIME }}

            5. 更新 [sing-box Test 版](https://github.com/SagerNet/sing-box/tree/testing) 至 v${{ env.SINGBOX_TEST_VERSION }}，发布于 ${{ env.SINGBOX_TEST_TIME }}

          file_glob: true
          file: ./sing-box/*


# ============================================================
# ============================================================
# README
# ============================================================
# ============================================================
#
# README 必须依赖最终 Release gate。
#
# 任何一个：
#   version failure
#   build failure
#
# 都不能更新 README。
#
# ============================================================

  update_readme:
    runs-on: ubuntu-latest

    needs:
      - puernya
      - puernya_cross

      - ref1nd_stable_version
      - ref1nd_stable_cross

      - ref1nd_test_version
      - ref1nd_test_cross

      - singbox_stable_version
      - singbox_stable_cross

      - singbox_test_version
      - singbox_test_cross

      - push_sing_box

    if: >
      ${{
        always() &&

        needs.push_sing_box.result == 'success' &&

        needs.puernya.result == 'success' &&
        (needs.puernya_cross.result == 'success' ||
         needs.puernya_cross.result == 'skipped') &&

        needs.ref1nd_stable_version.result == 'success' &&
        (needs.ref1nd_stable_cross.result == 'success' ||
         needs.ref1nd_stable_cross.result == 'skipped') &&

        needs.ref1nd_test_version.result == 'success' &&
        (needs.ref1nd_test_cross.result == 'success' ||
         needs.ref1nd_test_cross.result == 'skipped') &&

        needs.singbox_stable_version.result == 'success' &&
        (needs.singbox_stable_cross.result == 'success' ||
         needs.singbox_stable_cross.result == 'skipped') &&

        needs.singbox_test_version.result == 'success' &&
        (needs.singbox_test_cross.result == 'success' ||
         needs.singbox_test_cross.result == 'skipped')
      }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate README
        shell: bash
        run: |
          set -euo pipefail

          cat > README.md <<EOF
          # Sing-Box核心编译

          ## sing-box 内核 PuerNya 版

          \`\`\`bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-puernya-linux-amd64.tar.gz | tar -zx -C /usr/local/bin
          \`\`\`

          ## sing-box 内核 reF1nd-Stable 版

          \`\`\`bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3.tar.gz | tar -zx -C /usr/local/bin
          \`\`\`

          ## Changelog

          1. 更新 [sing-box PuerNya 版](https://github.com/PuerNya/sing-box/tree/building) 至 v${{ needs.puernya.outputs.puernya_version }}，发布于 ${{ needs.puernya.outputs.puernya_time }}

          2. 更新 [sing-box reF1nd-Stable 版](https://github.com/reF1nd/sing-box/tree/reF1nd-stable) 至 v${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_version }}，发布于 ${{ needs.ref1nd_stable_version.outputs.ref1nd_stable_time }}

          3. 更新 [sing-box reF1nd-Test 版](https://github.com/reF1nd/sing-box/tree/reF1nd-testing) 至 v${{ needs.ref1nd_test_version.outputs.ref1nd_test_version }}，发布于 ${{ needs.ref1nd_test_version.outputs.ref1nd_test_time }}

          4. 更新 [sing-box Stable 版](https://github.com/SagerNet/sing-box/tree/stable) 至 v${{ needs.singbox_stable_version.outputs.singbox_stable_version }}，发布于 ${{ needs.singbox_stable_version.outputs.singbox_stable_time }}

          5. 更新 [sing-box Test 版](https://github.com/SagerNet/sing-box/tree/testing) 至 v${{ needs.singbox_test_version.outputs.singbox_test_version }}，发布于 ${{ needs.singbox_test_version.outputs.singbox_test_time }}
          EOF

      - name: Commit README
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README 没有变化，无需提交"
            exit 0
          fi

          git commit -m "Update README"

          # 防止 workflow 与其他 main push 产生竞争
          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
```
