    steps:

      - name: Get reF1nd-Test version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # ==================================================
          # TAGS 在循环前写入
          # 不存在 break / exit 后面
          # ==================================================

          linux_tags="with_quic,with_utls,with_clash_api"
          windows_tags="with_gvisor,with_quic,with_utls,with_clash_api,with_tailscale"

          echo "linux_tags=$linux_tags" >> "$GITHUB_OUTPUT"
          echo "windows_tags=$windows_tags" >> "$GITHUB_OUTPUT"

          found=false

          for retry in {1..6}; do

            echo "开始获取 reF1nd-Test，第 ${retry}/6 次"

            for page in {1..10}; do

              echo "检查 tags 第 ${page} 页"

              tags="$(
                curl -fsSL \
                  --retry 5 \
                  --retry-delay 2 \
                  --retry-all-errors \
                  "https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100&page=${page}"
              )"

              if [[ "$(jq 'length' <<< "$tags")" -eq 0 ]]; then
                echo "第 ${page} 页为空"
                break
              fi

              version="$(
                jq -r '.[].name' <<< "$tags" |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)[^[:space:]]*-reF1nd([.-].*)?$' |
                head -n 1 || true
              )"

              if [[ -n "$version" && "$version" != "null" ]]; then

                echo "成功获取 reF1nd-Test: $version"

                commit_date="$(
                  curl -fsSL \
