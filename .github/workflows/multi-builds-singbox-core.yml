      skip: ${{ steps.compare.outputs.skip }}

    steps:
      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "tags=with_quic,with_utls,with_clash_api" >> "$GITHUB_OUTPUT"

          for page in {1..5}; do
            tags="$(
              curl -fsSL \
                "https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100&page=$page"
            )"

            version="$(
              jq -r '.[].name' <<< "$tags" |
              grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+.*(alpha|beta|rc).*-[Rr]eF1nd' ||
              true
            )"

            if [[ -n "$version" ]]; then
              version="${version#v}"

              commit_date="$(
                curl -fsSL \
                  "https://api.github.com/repos/reF1nd/sing-box/commits/v${version}" |
                jq -r '.commit.committer.date'
              )"

              [[ -n "$commit_date" && "$commit_date" != "null" ]]

              time="$(date -d "$commit_date +8 hours" '+%Y-%m-%d')"

              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "time=$time" >> "$GITHUB_OUTPUT"

              echo "reF1nd Test: $version ($time)"
              exit 0
            fi
          done

          echo "无法获取 reF1nd-Test 版本"
          exit 1

      - name: Compare
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          body="$(
            curl -fsSL \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
