# ============================================================
# Release
# ============================================================
  release:
    runs-on: ubuntu-latest

    needs:
      - puernya
      - ref1nd_stable
      - ref1nd_test
      - singbox_stable
      - singbox_test

      - build_puernya
      - build_ref1nd_stable
      - build_ref1nd_test
      - build_singbox_stable
      - build_singbox_test

    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download successful artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./tmp

          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --dir ./tmp \
            || true

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./sing-box

          # ----------------------------------------------------
          # PuerNya
          # ----------------------------------------------------
          if [[ "${{ needs.puernya.outputs.skip }}" != "true" ]]; then
            for arch in amd64-v1 amd64-v3 armv7 arm64; do
              src="./tmp/puernya-${arch}/sing-box"

              if [[ -f "$src" ]]; then
                mkdir -p ./package

                cp -f "$src" ./package/sing-box
                chmod +x ./package/sing-box

                tar \
                  --no-same-owner \
                  -czf "./sing-box/sing-box-puernya-linux-${arch}.tar.gz" \
                  -C ./package \
                  sing-box

                rm -f ./package/sing-box
              fi
            done
          fi

          # ----------------------------------------------------
          # reF1nd Stable
          # ----------------------------------------------------
          if [[ "${{ needs.ref1nd_stable.outputs.skip }}" != "true" ]]; then
            for arch in amd64-v1 amd64-v3 armv7 arm64; do
              src="./tmp/ref1nd-stable-${arch}/sing-box"
              dst="./sing-box/sing-box-ref1nd-stable-linux-${arch}.upx"

              if [[ -f "$src" ]]; then
                cp -f "$src" "$dst"
                chmod +x "$dst"
              fi
            done
          fi

          # ----------------------------------------------------
          # reF1nd Test
          # ----------------------------------------------------
          if [[ "${{ needs.ref1nd_test.outputs.skip }}" != "true" ]]; then
            for arch in amd64-v1 amd64-v3 armv7 arm64; do
              src="./tmp/ref1nd-test-${arch}/sing-box"
              dst="./sing-box/sing-box-ref1nd-test-linux-${arch}.upx"

              if [[ -f "$src" ]]; then
                cp -f "$src" "$dst"
                chmod +x "$dst"
              fi
            done
          fi

          # ----------------------------------------------------
          # sing-box Stable
          # ----------------------------------------------------
          if [[ "${{ needs.singbox_stable.outputs.skip }}" != "true" ]]; then
            for arch in amd64-v1 amd64-v3 armv7 arm64; do
              src="./tmp/singbox-stable-${arch}/sing-box"
              dst="./sing-box/sing-box-stable-linux-${arch}.upx"

              if [[ -f "$src" ]]; then
                cp -f "$src" "$dst"
                chmod +x "$dst"
              fi
            done
          fi

          # ----------------------------------------------------
          # sing-box Test
          # ----------------------------------------------------
          if [[ "${{ needs.singbox_test.outputs.skip }}" != "true" ]]; then
            for arch in amd64-v1 amd64-v3 armv7 arm64; do
              src="./tmp/singbox-test-${arch}/sing-box"
              dst="./sing-box/sing-box-test-linux-${arch}.upx"

              if [[ -f "$src" ]]; then
                cp -f "$src" "$dst"
                chmod +x "$dst"
              fi
            done
          fi

          echo
          echo "最终 Release 文件："

          if compgen -G "./sing-box/*" > /dev/null; then
            find ./sing-box \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
            sort
          else
            echo "没有成功生成任何文件"
          fi


      # ========================================================
      # UPX
      # ========================================================
      - name: Setup UPX
        if: ${{ hashFiles('./sing-box/*.upx') != '' }}
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          files: ./sing-box/*.upx


      # ========================================================
      # Release
      # ========================================================
      - name: Release
        if: ${{ hashFiles('./sing-box/*') != '' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box
          tag: sing-box
          overwrite: true
          file_glob: true
          file: ./sing-box/*

          body: |
            # 📝 Release Notes

            1. 更新 [sing-box PuerNya 版](https://github.com/PuerNya/sing-box/tree/building) 至 v${{ needs.puernya.outputs.version }}，发布于 ${{ needs.puernya.outputs.time }}

            2. 更新 [sing-box reF1nd-Stable 版](https://github.com/reF1nd/sing-box/tree/reF1nd-stable) 至 v${{ needs.ref1nd_stable.outputs.version }}，发布于 ${{ needs.ref1nd_stable.outputs.time }}

            3. 更新 [sing-box reF1nd-Test 版](https://github.com/reF1nd/sing-box/tree/reF1nd-testing) 至 v${{ needs.ref1nd_test.outputs.version }}，发布于 ${{ needs.ref1nd_test.outputs.time }}

            4. 更新 [sing-box Stable 版](https://github.com/SagerNet/sing-box/tree/stable) 至 v${{ needs.singbox_stable.outputs.version }}，发布于 ${{ needs.singbox_stable.outputs.time }}

            5. 更新 [sing-box Test 版](https://github.com/SagerNet/sing-box/tree/testing) 至 v${{ needs.singbox_test.outputs.version }}，发布于 ${{ needs.singbox_test.outputs.time }}

            ## 架构

            - linux-amd64-v1
            - linux-amd64-v3
            - linux-armv7
            - linux-arm64


# ============================================================
# README
# ============================================================
  Update_Readme:
    runs-on: ubuntu-latest

    needs:
      - puernya
      - ref1nd_stable
      - ref1nd_test
      - singbox_stable
      - singbox_test
      - release

    if: ${{ always() && needs.release.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate README
        shell: bash
        run: |
          set -euo pipefail

          cat > README.md <<'EOF'
          # Sing-Box 核心编译

          ## sing-box PuerNya 版

          ```bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-puernya-linux-amd64-v1.tar.gz | tar -zx -C /usr/local/bin
          ```

          ## sing-box reF1nd-Stable 版

          ```bash
          curl -L https://github.com/enpioodada/sing-box-core/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3.upx -o /usr/local/bin/sing-box
          chmod +x /usr/local/bin/sing-box
          ```

          ## 支持架构

          - amd64-v1
          - amd64-v3
          - armv7
          - arm64

          ## Changelog

          EOF

          cat >> README.md <<EOF
          1. 更新 [sing-box PuerNya 版](https://github.com/PuerNya/sing-box/tree/building) 至 v${{ needs.puernya.outputs.version }}，发布于 ${{ needs.puernya.outputs.time }}

          2. 更新 [sing-box reF1nd-Stable 版](https://github.com/reF1nd/sing-box/tree/reF1nd-stable) 至 v${{ needs.ref1nd_stable.outputs.version }}，发布于 ${{ needs.ref1nd_stable.outputs.time }}

          3. 更新 [sing-box reF1nd-Test 版](https://github.com/reF1nd/sing-box/tree/reF1nd-testing) 至 v${{ needs.ref1nd_test.outputs.version }}，发布于 ${{ needs.ref1nd_test.outputs.time }}

          4. 更新 [sing-box Stable 版](https://github.com/SagerNet/sing-box/tree/stable) 至 v${{ needs.singbox_stable.outputs.version }}，发布于 ${{ needs.singbox_stable.outputs.time }}

          5. 更新 [sing-box Test 版](https://github.com/SagerNet/sing-box/tree/testing) 至 v${{ needs.singbox_test.outputs.version }}，发布于 ${{ needs.singbox_test.outputs.time }}
          EOF

      - name: Commit README
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README 没有变化"
            exit 0
          fi

          git commit -m "Update README"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
