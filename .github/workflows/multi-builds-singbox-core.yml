      singbox_stable_VERSION: ${{ needs.singbox_stable_version.outputs.singbox_stable_version }}
      singbox_stable_linux_TAGS: ${{ needs.singbox_stable_version.outputs.singbox_stable_linux_tags }}
      singbox_stable_windows_TAGS: ${{ needs.singbox_stable_version.outputs.singbox_stable_windows_tags }}

    steps:

      - name: Checkout SagerNet/stable
        uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box
          ref: stable

      - name: Get Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://raw.githubusercontent.com/SagerNet/sing-box/stable/.github/workflows/build.yml |
            grep 'go-version:' |
            head -n 1 |
            awk '{print $2}'
          )"

          if [[ -z "$version" ]]; then
            echo "::error::无法获取 sing-box Stable Go 版本"
            exit 1
          fi

          echo "go_version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.go_version }}

      - name: Build sing-box Stable Linux
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${singbox_stable_VERSION}' -s -w -buildid=" \
            -tags "${singbox_stable_linux_TAGS}" \
            ./cmd/sing-box

          test -f sing-box

      - name: Build sing-box Stable Windows
        if: ${{ matrix.goos == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${singbox_stable_VERSION}' -s -w -buildid=" \
            -tags "${singbox_stable_windows_TAGS}" \
            ./cmd/sing-box

          test -f sing-box.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-stable-${{ matrix.name }}
          path: |
            sing-box
            sing-box.exe
          if-no-files-found: error


  # ============================================================
  # 6. sing-box Test
  # ============================================================
  singbox_test_version:
    runs-on: ubuntu-latest

    needs:
      - go

    outputs:
      singbox_test_version: ${{ steps.version.outputs.singbox_test_version }}
      singbox_test_time: ${{ steps.version.outputs.singbox_test_time }}

      singbox_test_linux_tags: ${{ steps.version.outputs.singbox_test_linux_tags }}
      singbox_test_windows_tags: ${{ steps.version.outputs.singbox_test_windows_tags }}

      singbox_test_skip_update: ${{ steps.compare.outputs.skip_update }}

    steps:

      - name: Get sing-box Test version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          singbox_test_linux_tags="with_quic,with_utls,with_clash_api"
          singbox_test_windows_tags="with_gvisor,with_quic,with_utls,with_clash_api,with_tailscale"

          echo "singbox_test_linux_tags=$singbox_test_linux_tags" >> "$GITHUB_OUTPUT"
          echo "singbox_test_windows_tags=$singbox_test_windows_tags" >> "$GITHUB_OUTPUT"

          while true; do

            releases="$(
              curl -fsSL \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=100"
            )"

            singbox_test_version="$(
              echo "$releases" |
              jq -r '
                .[]
                | select(.tag_name | test("alpha|beta|rc"))
                | .tag_name
              ' |
              head -n 1 |
              sed 's/^v//'
            )"

            if [[ -n "$singbox_test_version" &&
                  "$singbox_test_version" != "null" ]]; then

              echo "找到 sing-box Test: $singbox_test_version"

              singbox_test_time="$(
                echo "$releases" |
                jq -r '
                  .[]
                  | select(.tag_name | test("alpha|beta|rc"))
                  | (.published_at // .created_at)
                ' |
                head -n 1 |
                xargs -I {} date -d '{}' '+%Y-%m-%d'
              )"

              echo "singbox_test_version=$singbox_test_version" >> "$GITHUB_OUTPUT"
              echo "singbox_test_time=$singbox_test_time" >> "$GITHUB_OUTPUT"

              break
            fi

            echo "未获取到 sing-box Test，30 秒后重试"
            sleep 30

          done

      - name: Compare sing-box Test version
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          current_body="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          version="${{ steps.version.outputs.singbox_test_version }}"

          if echo "$current_body" | grep -Fq "$version"; then
            echo "sing-box Test 已是最新版本"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "sing-box Test 需要更新"
            echo "skip_update=false" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # sing-box Test Build
  # ============================================================
  singbox_test_cross:
    runs-on: ubuntu-latest

    needs:
      - singbox_test_version

    if: ${{ needs.singbox_test_version.outputs.singbox_test_skip_update != 'true' }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: linux-amd64-v1
            goos: linux
            goarch: amd64
            goamd64: v1

          - name: linux-amd64-v3
            goos: linux
            goarch: amd64
            goamd64: v3

          - name: linux-armv5
            goos: linux
            goarch: arm
            goarm: 5

          - name: linux-armv6
            goos: linux
            goarch: arm
            goarm: 6

          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7

          - name: linux-arm64
            goos: linux
            goarch: arm64

          - name: linux-mips-softfloat
            goos: linux
            goarch: mips
            gomips: softfloat

          - name: linux-mipsle-softfloat
            goos: linux
            goarch: mipsle
            gomips: softfloat

          - name: linux-mipsle-hardfloat
            goos: linux
            goarch: mipsle
            gomips: hardfloat

          - name: windows-amd64-v1
            goos: windows
            goarch: amd64
            goamd64: v1

          - name: windows-amd64-v3
            goos: windows
            goarch: amd64
            goamd64: v3

          - name: windows-arm64
            goos: windows
            goarch: arm64

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0

      singbox_test_VERSION: ${{ needs.singbox_test_version.outputs.singbox_test_version }}
      singbox_test_linux_TAGS: ${{ needs.singbox_test_version.outputs.singbox_test_linux_tags }}
      singbox_test_windows_TAGS: ${{ needs.singbox_test_version.outputs.singbox_test_windows_tags }}

    steps:

      - name: Checkout SagerNet/testing
        uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box
          ref: testing

      - name: Get Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              https://raw.githubusercontent.com/SagerNet/sing-box/testing/.github/workflows/build.yml |
            grep 'go-version:' |
            head -n 1 |
            awk '{print $2}'
          )"

          if [[ -z "$version" ]]; then
            echo "::error::无法获取 sing-box Test Go 版本"
            exit 1
          fi

          echo "go_version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.go_version }}

      - name: Build sing-box Test Linux
