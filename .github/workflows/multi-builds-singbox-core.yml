name: Update sing-box

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/workflows/delete-old-workflows.yml"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: update-sing-box
  cancel-in-progress: false


# ============================================================
# Get Go version
# ============================================================
jobs:

  go:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.go.outputs.version }}

    steps:
      - name: Get latest Go version
        id: go
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL \
              https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json |
            jq -r '.[0].version'
          )"

          [[ -n "$version" && "$version" != "null" ]]

          echo "Go version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"


# ============================================================
# PuerNya
# ============================================================
  puernya:
    runs-on: ubuntu-latest
    needs: go

    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: PuerNya/sing-box
          ref: building
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go.outputs.version }}

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch --tags upstream

          version="$(CGO_ENABLED=0 go run ./cmd/internal/read_tag)"
          [[ -n "$version" ]]

          commit="$(echo "$version" | awk -F '-' '{print $3}')"

          time="$(
            git log -1 \
              --format=%cd \
              --date=format:'%Y-%m-%d' \
              "$commit"
          )"

          tags="with_quic,with_dhcp,with_wireguard,with_shadowsocksr,with_ech,with_utls,with_clash_api,with_gvisor"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$time" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

          echo "PuerNya: $version ($time)"

      - name: Compare
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          body="$(
            curl -fsSL \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          version="${{ steps.version.outputs.version }}"

          if grep -Fq "$version" <<< "$body"; then
            echo "PuerNya 无需更新"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "PuerNya 需要更新"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi


# ============================================================
# reF1nd Stable
# ============================================================
  ref1nd_stable:
    runs-on: ubuntu-latest
    needs: go

    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}

    steps:
      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "tags=with_quic,with_utls,with_clash_api" >> "$GITHUB_OUTPUT"

          for page in {1..5}; do
            tags="$(
              curl -fsSL \
                "https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100&page=$page"
            )"

            version="$(
              jq -r '.[].name' <<< "$tags" |
              grep -m1 -E '^v?[0-9]+\.[0-9]+\.[0-9]+-reF1nd$' ||
              true
            )"

            if [[ -n "$version" ]]; then
              version="${version#v}"

              commit_date="$(
                curl -fsSL \
                  "https://api.github.com/repos/reF1nd/sing-box/commits/v${version}" |
                jq -r '.commit.committer.date'
              )"

              [[ -n "$commit_date" && "$commit_date" != "null" ]]

              time="$(date -d "$commit_date +8 hours" '+%Y-%m-%d')"

              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "time=$time" >> "$GITHUB_OUTPUT"

              echo "reF1nd Stable: $version ($time)"
              exit 0
            fi
          done

          echo "无法获取 reF1nd-Stable 版本"
          exit 1

      - name: Compare
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          body="$(
            curl -fsSL \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" |
            jq -r '.body // ""'
          )"

          version="${{ steps.version.outputs.version }}"

          if grep -Fq "$version" <<< "$body"; then
            echo "reF1nd-Stable 无需更新"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "reF1nd-Stable 需要更新"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi


